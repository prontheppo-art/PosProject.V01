<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>เปลี่ยนรหัสผ่านแอดมิน - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ล็อกหน้าจอไม่ให้ขยายหรือเลื่อนทั้งหน้า ป้องกันการยืดหดของ viewport บนมือถือ */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: #374151; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
        }

        /* จัดโครงสร้างให้อยู่กึ่งกลางหน้าจอพอดีและไม่หลุดเฟรม */
        .app-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100vw;
            box-sizing: border-box;
            padding: 16px;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-700">

    <div class="app-layout">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 text-center space-y-5">
            
            <div class="space-y-1">
                <div class="text-3xl mb-1">🔑</div>
                <h1 class="font-bold text-lg text-gray-800">เปลี่ยนรหัสผ่านแอดมิน</h1>
                <p class="text-xs text-gray-500">กำหนดรหัสผ่านใหม่สำหรับเข้าหลังบ้าน</p>
            </div>

            <div class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">รหัสผ่านปัจจุบัน:</label>
                    <div class="relative">
                        <input type="password" id="oldPassword" placeholder="กรอกรหัสผ่านปัจจุบัน" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-3 pr-10 text-xs outline-none focus:border-blue-500 font-bold">
                        <button type="button" onclick="togglePassword('oldPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm focus:outline-none">👁️</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">รหัสผ่านใหม่:</label>
                    <div class="relative">
                        <input type="password" id="newPassword" placeholder="กรอกรหัสผ่านใหม่" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-3 pr-10 text-xs outline-none focus:border-blue-500 font-bold">
                        <button type="button" onclick="togglePassword('newPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm focus:outline-none">👁️</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ยืนยันรหัสผ่านใหม่:</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-3 pr-10 text-xs outline-none focus:border-blue-500 font-bold">
                        <button type="button" onclick="togglePassword('confirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm focus:outline-none">👁️</button>
                    </div>
                </div>
            </div>

            <div class="space-y-2 pt-1">
                <button onclick="updatePassword()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow transition text-xs">
                    💾 บันทึกรหัสผ่านใหม่
                </button>
                <a href="PageAdmin.html" class="block w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl shadow transition text-xs text-center">
                    🔑 กลับหน้าผู้ดูแลระบบ
                </a>
            </div>

        </div>
    </div>

    <!-- Custom Modal แจ้งเตือน -->
    <div id="alertModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-center space-y-4">
            <div id="alertIcon" class="text-4xl mb-1">✅</div>
            <h3 id="alertTitle" class="font-bold text-base text-gray-800">แจ้งเตือน</h3>
            <p id="alertMessage" class="text-xs text-gray-600">ข้อความแจ้งเตือน...</p>
            <button onclick="closeAlertModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        let isSuccessAction = false;

        function showAlert(title, message, icon = "✅", isSuccess = false) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertIcon').textContent = icon;
            isSuccessAction = isSuccess;
            document.getElementById('alertModal').classList.remove('hidden');
        }

        function closeAlertModal() {
            document.getElementById('alertModal').classList.add('hidden');
            if (isSuccessAction) {
                window.location.href = 'PageAdmin.html';
            }
        }

        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function updatePassword() {
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            const savedPass = localStorage.getItem('adminPassword') || '00';

            if (!oldPass || !newPass || !confirmPass) {
                showAlert("⚠️ ข้อมูลไม่ครบ", "กรุณากรอกข้อมูลให้ครบถ้วนทุกช่อง!", "⚠️", false);
                return;
            }

            if (newPass !== confirmPass) {
                showAlert("❌ รหัสไม่ตรงกัน", "รหัสผ่านใหม่และยืนยันรหัสผ่านใหม่ไม่ตรงกัน!", "❌", false);
                return;
            }

            if (oldPass === savedPass) {
                localStorage.setItem('adminPassword', newPass);
                showAlert("สำเร็จ", "เปลี่ยนรหัสผ่านสำเร็จ!", "✅", true);
            } else {
                showAlert("❌ รหัสผ่านผิด", "รหัสผ่านปัจจุบันไม่ถูกต้อง!", "❌", false);
            }
        }
    </script>
</body>
</html>
