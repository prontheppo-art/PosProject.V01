<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; margin: 0; padding: 10px; }
        iframe { width: 100%; border: none; background: transparent; }
    </style>
</head>
<body class="max-w-md mx-auto flex flex-col h-screen justify-between pb-2">

    <!-- ส่วนหัวโปรแกรม -->
    <div class="flex items-center justify-between bg-amber-100 px-3 py-2 rounded-xl shadow-sm mb-2">
        <span class="font-bold text-amber-900 text-sm">🛒 ระบบรับออเดอร์จากลูกค้า</span>
    </div>

    <!-- พื้นที่จัดกลุ่มตามแบบร่าง (1, 2, 3) -->
    <div class="flex flex-col space-y-2.5 flex-grow overflow-y-auto">
        
        <!-- ส่วนที่ 1: กลุ่มลูกค้าและข้อมูลจัดส่ง (Customer-info.html) -->
        <div class="bg-white p-2 rounded-xl shadow-sm border border-amber-200">
            <iframe src="iframe_OrderTaking/Customer-info.html" class="h-24"></iframe>
        </div>

        <!-- ส่วนที่ 2: หมวดหมู่อาหาร (แก้ไขเป็น select-category.html ตามที่คุณต้องการ) -->
        <div class="bg-white p-2 rounded-xl shadow-sm border border-amber-200">
            <iframe src="iframe_OrderTaking/select-category.html" class="h-36"></iframe>
        </div>

        <!-- ส่วนที่ 3: รายการที่เลือกไว้ / ตะกร้าสินค้า (cart-preview.html) -->
        <div class="bg-white p-2 rounded-xl shadow-sm border border-amber-200 flex-grow">
            <iframe src="iframe_OrderTaking/cart-preview.html" class="h-full min-h-[150px]"></iframe>
        </div>

    </div>

    <!-- แถบเมนูด้านล่างสุด: HOME และ ตรวจสอบ Order -->
    <div class="grid grid-cols-2 gap-3 pt-2 mt-2 border-t border-gray-200 bg-white">
        <!-- ปุ่ม HOME ไปยัง Index.html -->
        <a href="Index.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2.5 px-4 rounded-xl text-center shadow-sm transition text-sm">
            🏠 HOME
        </a>
        <!-- ปุ่มตรวจสอบ Order ไปยัง CheckOrder.html (สีม่วง) -->
        <a href="CheckOrder.html" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-4 rounded-xl text-center shadow-sm transition text-sm">
            📦 ตรวจสอบ Order
        </a>
    </div>

</body>
</html>
