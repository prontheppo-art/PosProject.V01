<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรับออเดอร์จากลูกค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../root/key.js"></script>
    <style>
        body { background: #f1f5f9; margin: 0; padding: 0; font-family: sans-serif; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: white; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="p-3 space-y-3 pb-24 flex flex-col h-screen">
            
            <!-- ส่วนข้อมูลกลุ่มลูกค้าและการจัดส่ง -->
            <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs space-y-3 shadow-sm shrink-0">
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-bold text-amber-900 text-sm">👥 เลือกกลุ่มลูกค้า:</span>
                        <span id="selectedGroupBadge" class="bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full font-bold text-[11px]">ยังไม่ได้เลือก</span>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="selectCustomerGroup('ชาวบ้าน', 1)" id="btnGroup1" 
                                class="bg-white border-2 border-blue-500 text-blue-600 font-bold py-2 px-1 rounded-lg transition hover:bg-blue-50 active:bg-blue-100 cursor-pointer text-xs text-center truncate">
                            🏠 ชาวบ้าน
                        </button>
                        <button type="button" onclick="selectCustomerGroup('นักท่องเที่ยว', 2)" id="btnGroup2" 
                                class="bg-white border-2 border-orange-500 text-orange-600 font-bold py-2 px-1 rounded-lg transition hover:bg-orange-50 active:bg-orange-100 cursor-pointer text-xs text-center truncate">
                            🎒 นักท่องเที่ยว
                        </button>
                        <button type="button" onclick="selectCustomerGroup('สบายดี', 3)" id="btnGroup3" 
                                class="bg-white border-2 border-emerald-500 text-emerald-600 font-bold py-2 px-1 rounded-lg transition hover:bg-emerald-50 active:bg-emerald-100 cursor-pointer text-xs text-center truncate">
                            🌿 สบายดี
                        </button>
                    </div>
                </div>

                <div id="deliverySection" class="border-t border-amber-200 pt-2 hidden space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-amber-900">📍 ข้อมูลจัดส่ง (สถานที่ / โซน)</span>
                        <span id="phoneError" class="text-red-500 text-[10px] hidden">เบอร์โทรต้องครบ 10 หลัก</span>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" id="phoneInput" placeholder="เบอร์โทร 10 หลัก" maxlength="10" 
                               class="p-1.5 border rounded-lg text-center bg-white shadow-sm text-xs" 
                               oninput="validateAndSavePhone()">
                        
                        <button type="button" onclick="openLocationSelection()" class="p-1.5 border rounded-lg bg-white font-bold text-gray-700 text-left truncate shadow-sm cursor-pointer hover:bg-amber-100 transition">
                            <span id="selectedLocationText">-- สถานที่ --</span>
                        </button>
                        
                        <button type="button" onclick="openZoneSelection()" class="p-1.5 border rounded-lg bg-white font-bold text-gray-700 text-left truncate shadow-sm cursor-pointer hover:bg-amber-100 transition">
                            <span id="selectedZoneText">-- โซน --</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 1: กรอบ iframe เลือกหมวดหมู่ -->
            <div class="w-full h-52 shrink-0">
                <iframe src="iframe_OrderTaking/select-category.html" class="w-full h-full border-0 rounded-xl"></iframe>
            </div>

            <!-- ส่วนที่ 2: รายการสินค้าในตะกร้า (พื้นที่สีขาวตามภาพที่วงไว้) -->
            <div class="flex-1 bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <span class="font-bold text-slate-700 text-xs">🛒 รายการสินค้าในตะกร้า</span>
                    <span id="totalPriceBadge" class="bg-amber-100 text-amber-900 px-2 py-0.5 rounded-md font-bold text-[11px]">รวม: 0.-</span>
                </div>
                <div id="cartListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <!-- รายการสินค้าที่เลือกจะมาแสดงตรงนี้ -->
                    <div class="text-center text-gray-400 py-6 text-xs" id="emptyCartText">ยังไม่มีรายการสินค้าในตะกร้า</div>
                </div>
            </div>
        </div>

        <!-- Modal เลือกสถานที่ / โซน -->
        <div id="selectionModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
            <div class="bg-white rounded-xl max-w-xs w-full p-4 space-y-3 shadow-lg">
                <h3 id="modalTitle" class="font-bold text-amber-900 text-sm text-center">เลือกสถานที่จัดส่ง</h3>
                <div id="modalListContainer" class="max-h-48 overflow-y-auto space-y-1.5 text-xs"></div>
                <button type="button" onclick="closeSelectionModal()" class="w-full bg-gray-200 text-gray-700 font-bold py-1.5 rounded-lg text-xs cursor-pointer">
                    ปิด
                </button>
            </div>
        </div>

        <!-- Pop-up แสดงรายการอาหาร (แบบ Grid 3 คอลัมน์) -->
        <div id="foodMenuModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl max-w-sm w-full p-4 space-y-3 shadow-2xl">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 id="foodModalTitle" class="font-bold text-slate-800 text-sm">หมวดหมู่: เมนูอาหาร</h3>
                    <button type="button" onclick="closeFoodMenuModal()" class="text-gray-400 hover:text-gray-600 font-bold text-base cursor-pointer">✕</button>
                </div>
                <div id="foodListContainer" class="max-h-64 overflow-y-auto grid grid-cols-3 gap-2 py-1 pr-1"></div>
                <button type="button" onclick="closeFoodMenuModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl text-xs cursor-pointer transition">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>

        <!-- แถบเมนูด้านล่างสุด (Bottom Navigation) -->
        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 grid grid-cols-2 gap-2 shadow-lg">
            <button type="button" onclick="location.href='Index.html'" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-1 transition cursor-pointer">
                <span>🏠</span>
                <span>HOME</span>
            </button>
            <button type="button" onclick="location.href='CheckOrder.html'" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-1 transition cursor-pointer shadow">
                <span>📦</span>
                <span>ตรวจสอบ Order</span>
            </button>
        </div>

    </div>

    <script>
        // ตัวแปรเก็บรายการในตะกร้า
        let cart = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadSavedData();
            renderCart();
        });

        function selectCustomerGroup(groupName, groupId) {
            localStorage.setItem('customerGroupId', groupId);
            localStorage.setItem('customerGroupName', groupName);
            localStorage.setItem('selectedCustomerGroup', groupName);

            updateButtonGroupUI(groupName);
            toggleDeliverySection(groupName);
            saveDeliveryInfo();
        }

        function updateButtonGroupUI(groupName) {
            const badge = document.getElementById('selectedGroupBadge');
            if(badge) badge.textContent = groupName;

            ['1', '2', '3'].forEach(id => {
                const btn = document.getElementById('btnGroup' + id);
                if(btn) btn.classList.remove('ring-2', 'ring-offset-1', 'scale-95');
            });

            if (groupName === 'ชาวบ้าน') document.getElementById('btnGroup1')?.classList.add('ring-2', 'ring-blue-600');
            if (groupName === 'นักท่องเที่ยว') document.getElementById('btnGroup2')?.classList.add('ring-2', 'ring-orange-600');
            if (groupName === 'สบายดี') document.getElementById('btnGroup3')?.classList.add('ring-2', 'ring-emerald-600');
        }

        function toggleDeliverySection(groupName) {
            const deliverySection = document.getElementById('deliverySection');
            if (!deliverySection) return;

            if (groupName === 'นักท่องเที่ยว') {
                deliverySection.classList.remove('hidden');
            } else {
                deliverySection.classList.add('hidden');
                localStorage.removeItem('customerPhone');
                localStorage.removeItem('customerLocation');
                localStorage.removeItem('customerZone');
                localStorage.removeItem('customerLocationId');
                localStorage.removeItem('customerZoneId');
                
                const phoneInput = document.getElementById('phoneInput');
                if (phoneInput) phoneInput.value = '';
                const locText = document.getElementById('selectedLocationText');
                if (locText) locText.textContent = '-- สถานที่ --';
                const zoneText = document.getElementById('selectedZoneText');
                if (zoneText) zoneText.textContent = '-- โซน --';
            }
        }

        function validateAndSavePhone() {
            const phoneInput = document.getElementById('phoneInput');
            const errorSpan = document.getElementById('phoneError');
            const phoneVal = phoneInput.value.trim();

            phoneInput.value = phoneVal.replace(/\D/g, '');

            if (phoneInput.value.length > 0 && phoneInput.value.length < 10) {
                errorSpan.classList.remove('hidden');
            } else {
                errorSpan.classList.add('hidden');
                localStorage.setItem('customerPhone', phoneInput.value);
                saveDeliveryInfo();
            }
        }

        async function openLocationSelection() {
            const modal = document.getElementById('selectionModal');
            const title = document.getElementById('modalTitle');
            const container = document.getElementById('modalListContainer');

            title.textContent = "📍 เลือกสถานที่ (รีสอร์ต)";
            container.innerHTML = '<div class="text-center text-gray-400 py-2">กำลังโหลดข้อมูล...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const fallbackLocations = [
                { id: 1, name: 'บาหลี รีสอร์ท' },
                { id: 2, name: 'บ้านเขาบ้านเรา' },
                { id: 3, name: 'เดอะไพนส์ รีสอร์ท' },
                { id: 4, name: 'ภูผาธารา' }
            ];

            try {
                const { data, error } = await supabase.from('locations').select('id, name');
                if (error) throw error;
                renderLocationList(data && data.length > 0 ? data : fallbackLocations);
            } catch (err) {
                renderLocationList(fallbackLocations);
            }
        }

        function renderLocationList(locations) {
            const container = document.getElementById('modalListContainer');
            container.innerHTML = '';
            
            locations.forEach(loc => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "w-full text-left p-2 border rounded-lg bg-gray-50 hover:bg-amber-100 font-bold text-gray-700 transition cursor-pointer";
                btn.textContent = loc.name;
                btn.onclick = () => {
                    localStorage.setItem('customerLocationId', loc.id);
                    localStorage.setItem('customerLocation', loc.name);
                    localStorage.removeItem('customerZoneId');
                    localStorage.removeItem('customerZone');
                    
                    document.getElementById('selectedLocationText').textContent = loc.name;
                    document.getElementById('selectedZoneText').textContent = '-- โซน --';
                    
                    closeSelectionModal();
                    saveDeliveryInfo();
                };
                container.appendChild(btn);
            });
        }

        async function openZoneSelection() {
            const locationId = localStorage.getItem('customerLocationId');
            const locationName = localStorage.getItem('customerLocation');
            
            if (!locationId) {
                alert('กรุณาเลือก "สถานที่" ก่อนเลือก "โซน" ครับ');
                return;
            }

            const modal = document.getElementById('selectionModal');
            const title = document.getElementById('modalTitle');
            const container = document.getElementById('modalListContainer');

            title.textContent = `📌 เลือกโซนย่อย (${locationName})`;
            container.innerHTML = '<div class="text-center text-gray-400 py-2">กำลังโหลดข้อมูล...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const fallbackZones = [
                { id: 101, name: 'โซน A (ริมน้ำ)' },
                { id: 102, name: 'โซน B (สวนหย่อม)' },
                { id: 103, name: 'โซน VIP' }
            ];

            try {
                const { data, error } = await supabase
                    .from('zones')
                    .select('id, name')
                    .eq('location_id', locationId);

                if (error) throw error;
                renderZoneList(data && data.length > 0 ? data : fallbackZones);
            } catch (err) {
                renderZoneList(fallbackZones);
            }
        }

        function renderZoneList(zones) {
            const container = document.getElementById('modalListContainer');
            container.innerHTML = '';

            zones.forEach(zone => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "w-full text-left p-2 border rounded-lg bg-gray-50 hover:bg-amber-100 font-bold text-gray-700 transition cursor-pointer";
                btn.textContent = zone.name;
                btn.onclick = () => {
                    localStorage.setItem('customerZoneId', zone.id);
                    localStorage.setItem('customerZone', zone.name);
                    
                    document.getElementById('selectedZoneText').textContent = zone.name;
                    
                    closeSelectionModal();
                    saveDeliveryInfo();
                };
                container.appendChild(btn);
            });
        }

        function closeSelectionModal() {
            const modal = document.getElementById('selectionModal');
            if(modal) {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        async function selectCategory(categoryName) {
            localStorage.setItem('selectedCategory', categoryName);
            
            const modal = document.getElementById('foodMenuModal');
            const title = document.getElementById('foodModalTitle');
            const container = document.getElementById('foodListContainer');

            title.textContent = `หมวดหมู่: ${categoryName}`;
            container.innerHTML = '<div class="col-span-3 text-center text-gray-400 py-6 text-xs">กำลังโหลดเมนูอาหาร...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const fallbackFoods = [
                { name: 'กะเพราหมูสับ', price: 50 },
                { name: 'กะเพราไก่', price: 50 },
                { name: 'ข้าวผัดหมู', price: 50 },
                { name: 'ข้าวต้มปลา', price: 60 },
                { name: 'ข้าวไข่เจียว', price: 35 }
            ];

            try {
                const { data, error } = await supabase
                    .from('foods')
                    .select('name, price')
                    .eq('category_name', categoryName);

                if (error) throw error;

                const foodsToRender = (data && data.length > 0) ? data : fallbackFoods;
                renderFoodGrid(foodsToRender);

            } catch (err) {
                renderFoodGrid(fallbackFoods);
            }
        }

        function renderFoodGrid(foods) {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = '';

            const cardColors = [
                "bg-blue-600 hover:bg-blue-700 text-white",
                "bg-emerald-600 hover:bg-emerald-700 text-white",
                "bg-amber-500 hover:bg-amber-600 text-white",
                "bg-purple-600 hover:bg-purple-700 text-white",
                "bg-rose-500 hover:bg-rose-600 text-white",
                "bg-teal-600 hover:bg-teal-700 text-white"
            ];

            foods.forEach((food, index) => {
                const colorClass = cardColors[index % cardColors.length];

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `${colorClass} p-2.5 rounded-xl flex flex-col justify-between items-center text-center shadow transition cursor-pointer min-h-[75px]`;
                btn.innerHTML = `
                    <span class="font-bold text-xs line-clamp-1">${food.name}</span>
                    <span class="bg-black/20 px-2 py-0.5 rounded-md font-bold text-[11px] mt-1">${food.price}.-</span>
                `;
                btn.onclick = () => {
                    addToCart(food.name, food.price); // เพิ่มลงตะกร้าทันทีโดยไม่แจ้งเตือน
                    closeFoodMenuModal(); // ปิด Pop-up อัตโนมัติ
                };
                container.appendChild(btn);
            });
        }

        function closeFoodMenuModal() {
            const modal = document.getElementById('foodMenuModal');
            if(modal) {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        // ฟังก์ชันจัดการเพิ่มสินค้าลงตะกร้าและแสดงผลในช่องสีขาวด้านล่าง
        function addToCart(foodName, price) {
            const existingItem = cart.find(item => item.name === foodName);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name: foodName, price: price, qty: 1 });
            }
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartListContainer');
            const totalPriceBadge = document.getElementById('totalPriceBadge');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-6 text-xs">ยังไม่มีรายการสินค้าในตะกร้า</div>';
                if(totalPriceBadge) totalPriceBadge.textContent = 'รวม: 0.-';
                return;
            }

            let totalPrice = 0;

            cart.forEach((item, index) => {
                totalPrice += (item.price * item.qty);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg border border-slate-100";
                div.innerHTML = `
                    <span class="font-bold text-slate-700">${item.name} (${item.price}.-)</span>
                    <div class="flex items-center space-x-2">
                        <span class="text-emerald-600 font-bold">x${item.qty}</span>
                        <button type="button" onclick="removeFromCart(${index})" class="text-red-500 font-bold hover:text-red-700 cursor-pointer p-1">✕</button>
                    </div>
                `;
                container.appendChild(div);
            });

            if(totalPriceBadge) totalPriceBadge.textContent = `รวม: ${totalPrice}.-`;
        }

        function loadSavedData() {
            const savedGroup = localStorage.getItem('customerGroupName') || localStorage.getItem('selectedCustomerGroup') || 'ชาวบ้าน';
            updateButtonGroupUI(savedGroup);
            toggleDeliverySection(savedGroup);

            const phone = localStorage.getItem('customerPhone');
            if (phone && document.getElementById('phoneInput')) {
                document.getElementById('phoneInput').value = phone;
            }

            const loc = localStorage.getItem('customerLocation');
            if (loc && document.getElementById('selectedLocationText')) {
                document.getElementById('selectedLocationText').textContent = loc;
            }

            const zone = localStorage.getItem('customerZone');
            if (zone && document.getElementById('selectedZoneText')) {
                document.getElementById('selectedZoneText').textContent = zone;
            }
        }

        function saveDeliveryInfo() {
            const groupId = localStorage.getItem('customerGroupId');
            const groupName = localStorage.getItem('customerGroupName');
            const phone = localStorage.getItem('customerPhone');
            const locationId = localStorage.getItem('customerLocationId');
            const zoneId = localStorage.getItem('customerZoneId');

            console.log("ข้อมูลจัดส่งถูกอัปเดต:", { groupId, groupName, phone, locationId, zoneId });
        }
    </script>
</body>
</html>
