<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกกลุ่มลูกค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
        .custom-modal-box { background: white; width: 90%; max-width: 360px; border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); text-align: center; border-top: 6px solid #3b82f6; }
    </style>
</head>
<body>

<div class="custom-modal-box">
    <div class="text-base font-extrabold text-slate-800 mb-1">👥 กรุณาเลือกกลุ่มลูกค้า</div>
    <p class="text-xs text-gray-500 mb-5">เลือกประเภทเพื่อกำหนดราคาและรูปแบบออร์เดอร์</p>
    
    <div class="space-y-3">
        <button type="button" onclick="selectGroupAndGo('ชาวบ้าน')" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer">
            <span>🏠</span> ชาวบ้าน
        </button>
        <button type="button" onclick="selectGroupAndGo('นักท่องเที่ยว')" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer">
            <span>🎒</span> นักท่องเที่ยว
        </button>
        <button type="button" onclick="selectGroupAndGo('สบายดี')" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer">
            <span>🌿</span> สบายดี
        </button>
    </div>

    <button type="button" onclick="closePopup()" class="mt-5 text-gray-400 hover:text-gray-600 text-xs font-bold py-1 px-3 cursor-pointer">
        ✕ ปิดหน้าต่าง
    </button>
</div>

<script>
    function selectGroupAndGo(groupName) {
        localStorage.setItem('selectedCustomerGroup', groupName);
        window.location.href = '../ordermenu.html'; // ถอยกลับ 1 ระดับเพื่อไปหน้าสั่งอาหาร
    }

    function closePopup() {
        window.location.href = '../index.html'; // กลับสู่หน้าหลัก
    }
</script>
</body>
</html>
