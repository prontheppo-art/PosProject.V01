<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเมนูอาหาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 font-sans min-h-screen flex items-start justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 h-[92vh] flex flex-col">
        
        <!-- ส่วนหัวและฟอร์มด้านบน -->
        <div class="shrink-0 bg-white pb-3 z-10">
            <h2 class="text-xl font-bold text-red-600 text-center mb-3">ระบบจัดการเมนูอาหาร</h2>
            
            <div class="space-y-2.5">
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-bold text-gray-700">หมวดหมู่</label>
                        <button type="button" onclick="openEditCategoryModal()" id="editCategoryBtn" class="text-[10px] font-bold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-2 py-0.5 rounded-lg transition items-center gap-1 shadow-2xs">
                            ✏️ แก้ไขกลุ่มรายการ
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="relative">
                        <button type="button" onclick="toggleCategoryDropdown()" id="categorySelectBtn" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-white font-medium text-left flex items-center justify-between shadow-2xs">
                            <span id="selectedCategoryText" class="truncate text-gray-700">-- แสดงทั้งหมด --</span>
                            <span class="text-gray-400 text-[10px] shrink-0 ml-1">▼</span>
                        </button>
                        
                        <div id="categoryDropdownPopup" class="hidden absolute left-0 top-full mt-1.5 bg-white border border-gray-200 rounded-2xl shadow-2xl z-50 p-2 space-y-1 w-max min-w-full"></div>
                    </div>

                    <input type="text" id="menuNameInput" placeholder="เช่น ส้มตำไทย" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ราคาตามกลุ่มลูกค้า:</label>
                    <div id="priceInputsContainer" class="grid grid-cols-3 gap-1.5 max-h-28 overflow-y-auto pr-1">
                        <div class="col-span-3 text-center text-gray-400 text-xs py-2">⏳ กำลังโหลดกลุ่มลูกค้า...</div>
                    </div>
                </div>
            </div>
        </div>

        <hr class="border-gray-200 my-2 shrink-0">

        <div class="text-xs font-bold text-gray-700 mb-2 shrink-0">
            <span class="text-red-500">❌</span> เพื่อลบ / แตะเพื่อแก้ไขข้อมูล:
        </div>
        
        <!-- รายการเมนูอาหาร (เลื่อนดูได้ตรงกลาง) -->
        <div id="menuListContainer" class="grid grid-cols-2 gap-2 overflow-y-auto pr-1 flex-1 content-start mb-2">
            <div class="col-span-2 text-center text-gray-400 text-xs py-4">⏳ กำลังโหลดรายการเมนู...</div>
        </div>

        <!-- ส่วนปุ่มควบคุมด้านล่างสุด -->
        <div class="shrink-0 pt-2 border-t border-gray-100 mt-auto">
            <div class="grid grid-cols-2 gap-2">
                <a href="adminmenu.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-1 shadow-xs">
                    🔑 กลับผู้ดูแลระบบ
                </a>
                <button onclick="saveMenu()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                    💾 บันทึก
                </button>
            </div>
        </div>
    </div>

    <!-- Modal ต่างๆ -->
    <div id="editCategoryModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-center space-y-3">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-1 shadow-inner">✏️</div>
            <h3 class="font-bold text-sm text-gray-800">แก้ไขชื่อกลุ่มรายการ</h3>
            <p id="editCategorySubText" class="text-[11px] text-gray-500">เปลี่ยนชื่อหมวดหมู่จากเดิม</p>
            <input type="text" id="editCategoryInput" placeholder="ชื่อกลุ่มรายการใหม่..." class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none text-center font-medium bg-gray-50 focus:bg-white transition">
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeEditCategoryModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition">ยกเลิก</button>
                <button onclick="confirmEditCategory()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">บันทึกการแก้ไข</button>
            </div>
        </div>
    </div>

    <div id="moveCategoryModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-left space-y-3 animate-in fade-in zoom-in duration-200">
            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-1 shadow-inner">✏️</div>
            <h3 class="font-bold text-sm text-gray-800 text-center">จัดการรายการอาหาร</h3>
            <p id="moveMenuTitleText" class="text-[11px] text-gray-500 text-center pb-1">แก้ไขชื่อหรือย้ายกลุ่มรายการ</p>
            
            <div class="space-y-2">
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">ชื่อเมนูอาหาร:</label>
                    <input type="text" id="editMenuNameInput" placeholder="ชื่อเมนูอาหาร..." class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-gray-50 focus:bg-white font-medium text-gray-800 transition shadow-2xs">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">กลุ่มรายการ (หมวดหมู่):</label>
                    <select id="targetCategorySelect" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-gray-50 focus:bg-white font-medium text-gray-800 transition shadow-2xs"></select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeMoveCategoryModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition text-center">ยกเลิก</button>
                <button onclick="confirmEditAndMoveMenu()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm text-center">บันทึกการแก้ไข</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-center space-y-3">
            <div id="alertIcon" class="text-3xl mb-1">⚠️</div>
            <h3 id="alertTitle" class="font-bold text-sm text-gray-800">แจ้งเตือน</h3>
            <p id="alertMessage" class="text-xs text-gray-600">ข้อความ...</p>
            <button onclick="document.getElementById('alertModal').classList.add('hidden')" class="w-full bg-red-600 text-white font-bold py-2 rounded-xl text-xs">ตกลง</button>
        </div>
    </div>

    <script src="codekey.js"></script>
    <script>
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let allMenus = [];
        let allGroups = [];
        let categoriesList = [];
        let currentSelectedCategory = 'all';
        let selectedFoodIdForMove = null;

        function cleanGroupName(name) {
            if (!name) return '';
            return name
                .replace(/ชาวบ้าน\s*\/\s*/g, '')
                .replace(/สมาชิก\s*VIP\s*\/\s*/g, '')
                .trim();
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadGroups();
            await loadFoods();

            window.addEventListener('click', (e) => {
                const btn = document.getElementById('categorySelectBtn');
                const popup = document.getElementById('categoryDropdownPopup');
                if (!btn.contains(e.target) && !popup.contains(e.target)) {
                    popup.classList.add('hidden');
                }
            });
        });

        async function loadCategoriesFromFoods() {
            const uniqueCategories = [...new Set(allMenus.map(m => m.category).filter(Boolean))];
            categoriesList = uniqueCategories.sort();
            renderCategoryDropdownPopup();

            if (currentSelectedCategory !== 'all' && !categoriesList.includes(currentSelectedCategory)) {
                selectCategory('all', '-- แสดงทั้งหมด --');
            }
        }

        function renderCategoryDropdownPopup() {
            const popup = document.getElementById('categoryDropdownPopup');
            
            let html = `
                <div onclick="selectCategory('all', '-- แสดงทั้งหมด --')" class="px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition hover:bg-gray-100 flex items-center justify-between whitespace-nowrap gap-4 ${currentSelectedCategory === 'all' ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-700'}">
                    <span class="truncate">-- แสดงทั้งหมด --</span>
                    ${currentSelectedCategory === 'all' ? '<span class="shrink-0 ml-2">✓</span>' : ''}
                </div>
            `;

            categoriesList.forEach(cat => {
                const isSelected = currentSelectedCategory === cat;
                html += `
                    <div onclick="selectCategory('${cat}', '${cat}')" class="px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition hover:bg-gray-100 flex items-center justify-between whitespace-nowrap gap-4 ${isSelected ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-700'}">
                        <span class="truncate">📁 ${cat}</span>
                        ${isSelected ? '<span class="shrink-0 ml-2">✓</span>' : ''}
                    </div>
                `;
            });

            popup.innerHTML = html;
        }

        function toggleCategoryDropdown() {
            const popup = document.getElementById('categoryDropdownPopup');
            popup.classList.toggle('hidden');
        }

        function selectCategory(value, label) {
            currentSelectedCategory = value;
            document.getElementById('selectedCategoryText').textContent = label;
            document.getElementById('categoryDropdownPopup').classList.add('hidden');
            renderCategoryDropdownPopup();
            filterMenuList();
        }

        function openEditCategoryModal() {
            if (currentSelectedCategory === 'all') {
                showAlert('แจ้งเตือน', 'กรุณาเลือกกลุ่มรายการที่ต้องการแก้ไขก่อน');
                return;
            }
            document.getElementById('editCategoryInput').value = currentSelectedCategory;
            document.getElementById('editCategorySubText').textContent = `กำลังแก้ไขหมวดหมู่: "${currentSelectedCategory}"`;
            document.getElementById('editCategoryModal').classList.remove('hidden');
        }

        function closeEditCategoryModal() {
            document.getElementById('editCategoryModal').classList.add('hidden');
        }

        async function confirmEditCategory() {
            const oldCatName = currentSelectedCategory;
            const newCatName = document.getElementById('editCategoryInput').value.trim();

            if (!newCatName) {
                showAlert('แจ้งเตือน', 'กรุณากรอกชื่อกลุ่มรายการใหม่');
                return;
            }

            if (oldCatName === newCatName) {
                closeEditCategoryModal();
                return;
            }

            if (categoriesList.includes(newCatName)) {
                showAlert('แจ้งเตือน', 'มีชื่อกลุ่มรายการนี้อยู่ในระบบแล้ว');
                return;
            }

            const { error: foodErr } = await db.from('foods').update({ category: newCatName }).eq('category', oldCatName);
            if (foodErr) {
                showAlert('ข้อผิดพลาด', 'ไม่สามารถอัปเดตชื่อหมวดหมู่ในรายการอาหารได้: ' + foodErr.message);
                return;
            }

            closeEditCategoryModal();
            await loadFoods();
            selectCategory(newCatName, newCatName);
        }

        function openMoveCategoryModal(foodId, foodName, currentCat) {
            selectedFoodIdForMove = foodId;
            document.getElementById('editMenuNameInput').value = foodName;
            
            const selectEl = document.getElementById('targetCategorySelect');
            selectEl.innerHTML = categoriesList.map(cat => `
                <option value="${cat}" ${cat === currentCat ? 'selected' : ''}>📁 ${cat}</option>
            `).join('');

            document.getElementById('moveCategoryModal').classList.remove('hidden');
        }

        function closeMoveCategoryModal() {
            document.getElementById('moveCategoryModal').classList.add('hidden');
            selectedFoodIdForMove = null;
        }

        async function confirmEditAndMoveMenu() {
            if (!selectedFoodIdForMove) return;
            const newName = document.getElementById('editMenuNameInput').value.trim();
            const newCategory = document.getElementById('targetCategorySelect').value;

            if (!newName) {
                showAlert('แจ้งเตือน', 'กรุณากรอกชื่อเมนูอาหาร');
                return;
            }

            const { error } = await db.from('foods')
                .update({ name: newName, category: newCategory })
                .eq('id', selectedFoodIdForMove);

            if (error) {
                showAlert('ข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้: ' + error.message);
                return;
            }

            closeMoveCategoryModal();
            await loadFoods();
            showAlert('สำเร็จ', 'อัปเดตข้อมูลเมนูอาหารเรียบร้อยแล้ว', '✅');
        }

        async function loadGroups() {
            const container = document.getElementById('priceInputsContainer');
            const { data, error } = await db.from('customer_groups').select('*').order('id', { ascending: true });
            if (data) {
                allGroups = data;
                container.innerHTML = data.map(g => `
                    <div class="bg-gray-50 p-1.5 rounded-xl border border-gray-200 flex flex-col items-center">
                        <span class="text-[10px] font-bold text-gray-600 truncate mb-1 w-full text-center">${cleanGroupName(g.name)}</span>
                        <input type="number" data-group-id="${g.id}" placeholder="ราคา" min="0" step="any"
                               class="price-input w-full border border-gray-300 rounded-lg px-1 py-1 text-center text-xs outline-none bg-white">
                    </div>
                `).join('');
            } else if (error) {
                container.innerHTML = `<div class="col-span-3 text-center text-red-500 text-xs py-2">โหลดกลุ่มลูกค้าไม่สำเร็จ</div>`;
            }
        }

        async function loadFoods() {
            const { data: mData } = await db.from('foods').select('*').order('name', { ascending: true });
            allMenus = mData || [];
            await loadCategoriesFromFoods();
            filterMenuList();
        }

        function filterMenuList() {
            const container = document.getElementById('menuListContainer');
            
            let filtered = allMenus;
            if (currentSelectedCategory !== 'all') {
                filtered = allMenus.filter(m => m.category === currentSelectedCategory);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-gray-400 text-xs py-4">ยังไม่มีรายการเมนูในระบบ</div>`;
                return;
            }

            container.innerHTML = filtered.map(m => `
                <div class="flex items-center bg-white border border-gray-200 hover:bg-red-50/30 p-2 rounded-xl transition shadow-2xs h-fit gap-2">
                    <button onclick="deleteMenu('${m.id}', '${m.name.replace(/'/g, "\\'")}')" class="w-5 h-5 bg-red-100 hover:bg-red-200 text-red-500 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0" title="ลบเมนู">✕</button>
                    <span onclick="openMoveCategoryModal('${m.id}', '${m.name.replace(/'/g, "\\'")}', '${m.category}')" class="text-[11px] font-medium text-gray-800 truncate cursor-pointer hover:text-blue-600 transition flex-1" title="คลิกเพื่อแก้ไขชื่อหรือย้ายกลุ่ม">${m.name}</span>
                </div>
            `).join('');
        }

        async function saveMenu() {
            const category = currentSelectedCategory;
            const name = document.getElementById('menuNameInput').value.trim();
            
            if (!category || category === 'all' || !name) {
                showAlert('แจ้งเตือน', 'กรุณาเลือกหมวดหมู่ (ที่ไม่ใช่ทั้งหมด) และกรอกชื่อเมนู');
                return;
            }
            
            const { data: foodData, error: foodErr } = await db.from('foods').insert([{ name, category }]).select();
            
            if (foodErr) {
                showAlert('แจ้งเตือน', 'บันทึกไม่สำเร็จหรือมีชื่อเมนูนี้อยู่แล้ว: ' + foodErr.message);
                return;
            }

            if (foodData && foodData.length > 0) {
                const foodId = foodData[0].id;
                
                const priceInputs = document.querySelectorAll('.price-input');
                const priceRecords = [];

                priceInputs.forEach(input => {
                    const groupId = input.getAttribute('data-group-id');
                    const priceVal = parseFloat(input.value);
                    if (!isNaN(priceVal) && priceVal >= 0) {
                        priceRecords.push({
                            food_id: foodId,
                            customer_group_id: parseInt(groupId),
                            price: priceVal
                        });
                    }
                });

                if (priceRecords.length > 0) {
                    const { error: priceErr } = await db.from('food_prices').insert(priceRecords);
                    if (priceErr) {
                        console.error("เกิดข้อผิดพลาดในการบันทึกราคา:", priceErr);
                    }
                }

                document.getElementById('menuNameInput').value = '';
                priceInputs.forEach(i => i.value = '');
                
                await loadFoods();
                selectCategory(category, category);
            }
        }

        async function deleteMenu(id, name) {
            if (!confirm(`ต้องการลบเมนู "${name}" ใช่หรือไม่?`)) return;
            
            await db.from('food_prices').delete().eq('food_id', id);
            const { error } = await db.from('foods').delete().eq('id', id);
            
            if (!error) {
                await loadFoods();
            } else {
                showAlert('ข้อผิดพลาด', 'ไม่สามารถลบเมนูได้: ' + error.message);
            }
        }

        function showAlert(title, msg, icon = "⚠️") {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = msg;
            document.getElementById('alertIcon').textContent = icon;
            document.getElementById('alertModal').classList.remove('hidden');
        }
    </script>
</body>
</html>
