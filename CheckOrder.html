<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สรุปรายการสั่งอาหาร - ตรวจสอบและยืนยัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="key.js"></script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: #f4f6f9; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
        }
        
        /* ล็อกหน้าจอด้วย Grid Layout: ส่วนบน(auto), ส่วนกลาง(1fr ขยายตามพื้นที่เหลือและให้สกอร์ในนี้), ส่วนล่าง(auto) */
        .app-layout { 
            display: grid; 
            grid-template-rows: auto 1fr auto; 
            height: 100dvh; 
            max-width: 500px; 
            margin: 0 auto; 
            background: #fff; 
            box-sizing: border-box; 
            overflow: hidden;
        }

        .header-section { padding: 12px; background: #fff; border-bottom: 1px solid #e2e8f0; z-index: 10; flex-shrink: 0; }
        
        /* ส่วนกลางที่เป็นพื้นที่แสดงรายการอาหาร ให้มี Scrollbar เฉพาะจุดนี้เท่านั้น */
        .content-section { 
            padding: 12px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            -webkit-overflow-scrolling: touch;
        }

        .footer-section { padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px; z-index: 10; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- ส่วนหัว (Header - ล็อกนิ่งอยู่ด้านบน) -->
    <div class="header-section">
        <h1 class="font-bold text-base text-slate-800">📋 ตรวจสอบรายการออร์เดอร์</h1>
    </div>

    <!-- ส่วนเนื้อหา (Content - เลื่อนเฉพาะในกรอบนี้เมื่อรายการอาหารเยอะ) -->
    <div class="content-section">
        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg mb-4 text-xs font-semibold text-amber-800 flex justify-between shrink-0">
            <span>กลุ่มลูกค้า: <span id="lblGroup" class="text-slate-900">-</span></span>
            <span>วันที่สั่ง: <span id="lblDate" class="text-slate-900">-</span></span>
        </div>

        <div id="deliveryInfoBox" class="bg-blue-50 border border-blue-200 p-3 rounded-lg mb-4 text-xs text-blue-900 hidden shrink-0">
            <div class="font-bold mb-1">📍 ข้อมูลจัดส่ง:</div>
            <div>เบอร์โทร: <span id="lblPhone">-</span></div>
            <div>สถานที่: <span id="lblLocation">-</span> | โซน: <span id="lblZone">-</span></div>
        </div>

        <div class="border rounded-lg overflow-hidden mb-4 shrink-0">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-slate-100 text-slate-700 border-b">
                        <th class="p-2.5">รายการอาหาร</th>
                        <th class="p-2.5 text-center">จำนวน</th>
                        <th class="p-2.5 text-right">รวม (บาท)</th>
                    </tr>
                </thead>
                <tbody id="cartTableBody">
                    <tr><td colspan="3" class="text-center p-4 text-slate-400">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-lg flex justify-between items-center text-sm font-bold text-emerald-900 shrink-0">
            <span id="summaryCountText">0 รายการ | 0 ชิ้น</span>
            <span>ราคารวมทั้งหมด: <span id="summaryTotalPrice" class="text-base text-emerald-700">0</span> บาท</span>
        </div>
    </div>

    <!-- ส่วนล่าง (Footer - ล็อกติดขอบล่างตลอดเวลา มองเห็นปุ่มเสมอ) -->
    <div class="footer-section">
        <div class="flex gap-2">
            <a href="TakeOrder.html" class="bg-slate-500 text-white font-bold py-2.5 px-3 rounded-lg text-xs text-center hover:bg-slate-600 flex-1 flex items-center justify-center shadow">⬅️ สั่งอาหารเพิ่ม</a>
            <button onclick="confirmFinalOrder()" class="bg-emerald-600 text-white font-bold py-2.5 px-3 rounded-lg text-xs flex-1 hover:bg-emerald-700 shadow">🖨️ พิมพ์ใบเสร็จ</button>
        </div>
    </div>
</div>

<script>
    // ป้องกันการซูมหน้าจอด้วยนิ้ว
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentOrder = null;
    let orderItems = [];

    window.onload = function() {
        loadLatestOrder();
    };

    async function loadLatestOrder() {
        try {
            const { data, error } = await db
                .from('orders')
                .select('*')
                .eq('status', 'pending')
                .order('id', { ascending: false })
                .limit(1);

            if (error) throw error;

            if (!data || data.length === 0) {
                document.getElementById('cartTableBody').innerHTML = `<tr><td colspan="3" class="text-center p-4 text-slate-400">ยังไม่มีรายการออร์เดอร์ที่รอตรวจสอบ</td></tr>`;
                return;
            }

            currentOrder = data[0];
            
            if (typeof currentOrder.items === 'string') {
                orderItems = JSON.parse(currentOrder.items);
            } else {
                orderItems = currentOrder.items || [];
            }

            document.getElementById('lblGroup').textContent = currentOrder.customer_group || 'ทั่วไป';
            document.getElementById('lblDate').textContent = currentOrder.order_date || '-';

            if (currentOrder.customer_group && currentOrder.customer_group.includes('นักท่องเที่ยว')) {
                document.getElementById('deliveryInfoBox').classList.remove('hidden');
                document.getElementById('lblPhone').textContent = currentOrder.phone || '-';
                document.getElementById('lblLocation').textContent = currentOrder.location_name || '-';
                document.getElementById('lblZone').textContent = currentOrder.zone_name || '-';
            }

            renderTable();

        } catch (err) {
            console.error('Error loading order:', err);
            document.getElementById('cartTableBody').innerHTML = `<tr><td colspan="3" class="text-center p-4 text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
        }
    }

    function renderTable() {
        const tbody = document.getElementById('cartTableBody');
        tbody.innerHTML = '';

        if (orderItems.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-slate-400">ไม่มีรายการอาหาร</td></tr>`;
            document.getElementById('summaryCountText').textContent = '0 รายการ | 0 ชิ้น';
            document.getElementById('summaryTotalPrice').textContent = '0';
            return;
        }

        let totalQty = 0;
        let totalPrice = 0;

        orderItems.forEach((item) => {
            const itemQty = Number(item.qty || 1);
            const itemPrice = Number(item.price || 0);
            totalQty += itemQty;
            totalPrice += itemPrice * itemQty;

            const tr = document.createElement('tr');
            tr.className = 'border-b hover:bg-slate-50';
            tr.innerHTML = `
                <td class="p-2.5 font-medium text-slate-800">
                    ${item.name}
                    ${item.note ? `<div class="text-[10px] text-rose-500 font-semibold">หมายเหตุ: ${item.note}</div>` : ''}
                </td>
                <td class="p-2.5 text-center font-bold text-slate-700">${itemQty}</td>
                <td class="p-2.5 text-right font-bold text-blue-600">${(itemPrice * itemQty).toLocaleString()}.-</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('summaryCountText').textContent = `${orderItems.length} รายการ | ${totalQty} ชิ้น`;
        document.getElementById('summaryTotalPrice').textContent = totalPrice.toLocaleString();
    }

    async function confirmFinalOrder() {
        if (!currentOrder || orderItems.length === 0) {
            return;
        }

        try {
            for (let item of orderItems) {
                let { data: mappings, error: mapError } = await db
                    .from('food_mappings')
                    .select('*')
                    .eq('food_id', item.id);

                if (mapError) throw new Error(mapError.message);

                if (mappings && mappings.length > 0) {
                    for (let map of mappings) {
                        let stockName = map.stock_name || map.food_name;
                        let { data: stock, error: stockError } = await db
                            .from('food_stocks')
                            .select('*')
                            .eq('food_name', stockName)
                            .single();

                        if (stockError) continue;

                        if (stock && stock.quantity < item.qty) {
                            return;
                        }
                    }
                }
            }

            for (let item of orderItems) {
                let { data: mappings } = await db
                    .from('food_mappings')
                    .select('*')
                    .eq('food_id', item.id);

                if (mappings && mappings.length > 0) {
                    for (let map of mappings) {
                        let stockName = map.stock_name || map.food_name;
                        let { data: stock } = await db
                            .from('food_stocks')
                            .select('id, quantity')
                            .eq('food_name', stockName)
                            .single();

                        if (stock) {
                            let newQuantity = Number(stock.quantity) - Number(item.qty);
                            await db
                                .from('food_stocks')
                                .update({ quantity: newQuantity, updated_at: new Date().toISOString() })
                                .eq('id', stock.id);
                        }
                    }
                }
            }

            let { error: updateError } = await db
                .from('orders')
                .update({ status: 'completed' })
                .eq('id', currentOrder.id);

            if (updateError) throw updateError;

            localStorage.setItem('lastCompletedOrder', JSON.stringify(orderItems));
            localStorage.setItem('orderRecordDate', currentOrder.order_date || new Date().toLocaleDateString('th-TH'));

            window.location.href = 'print.html';

        } catch (err) {
            console.error('Confirmation Error:', err);
        }
    }
</script>
</body>
</html>
