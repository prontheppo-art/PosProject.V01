<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปรายการสั่งอาหาร</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #f4f6f9; }
        .app-layout { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; background: #fff; box-sizing: border-box; }
        .fixed-top-section { flex-shrink: 0; background: #fff; padding: 12px; border-bottom: 1px solid #e2e8f0; z-index: 10; }
        .scrollable-middle-section { flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- ส่วนหัว -->
    <div class="fixed-top-section">
        <div class="flex justify-between items-center mb-3">
            <h1 class="font-bold text-base text-slate-800 flex items-center gap-1.5">
                <span>📋</span> สรุปรายการสั่งอาหาร
            </h1>
            <a href="OrderTaking.html" class="bg-slate-500 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow transition cursor-pointer">
                ⬅ สั่งเพิ่ม
            </a>
        </div>

        <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl flex justify-between items-center text-xs text-amber-900 font-bold shadow-sm">
            <div>กลุ่มลูกค้า: <span id="customerGroupText" class="text-amber-700 font-extrabold">-</span></div>
            <div>วันที่สั่ง: <span id="orderDateText" class="text-amber-700 font-extrabold">-</span></div>
        </div>
    </div>

    <!-- ส่วนตารางรายการอาหาร -->
    <div class="scrollable-middle-section">
        <div class="bg-white border rounded-xl overflow-hidden shadow-sm flex flex-col flex-grow">
            <div class="grid grid-cols-12 bg-slate-100 p-2.5 text-xs font-bold text-slate-700 border-b text-center">
                <div class="col-span-5 text-left pl-1">รายการอาหาร</div>
                <div class="col-span-2">จำนวน</div>
                <div class="col-span-3">รวม (บาท)</div>
                <div class="col-span-2">จัดการ</div>
            </div>

            <!-- รายการสินค้าจำลอง หรือจะถูกแทนที่ด้วย Javascript -->
            <div id="orderTableBody" class="divide-y text-xs flex-grow overflow-y-auto">
                <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่ -->
            </div>
        </div>

        <!-- กล่องสรุปยอดรวมด้านล่างตาราง -->
        <div class="bg-green-50 border border-green-200 p-3 rounded-xl flex justify-between items-center text-xs font-bold text-green-900 shrink-0 shadow-sm">
            <span id="totalItemsSummaryText">0 รายการ | 0 ชิ้น</span>
            <span class="text-sm">ราคารวมทั้งหมด: <span id="grandTotalPriceText" class="text-green-700 font-extrabold text-base">0</span> บาท</span>
        </div>
    </div>

    <!-- ปุ่มยืนยันด้านล่างสุด (ลิงก์ไป bill.html) -->
    <div class="bg-white p-3 border-t shrink-0">
        <button type="button" onclick="confirmOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-sm shadow-md transition cursor-pointer flex items-center justify-center gap-1.5">
            <span>✅</span> ยืนยันการส่งออร์เดอร์
        </button>
    </div>
</div>

<script src="key.js"></script>
<script>
    let cart = [];

    window.onload = function() {
        // 1. โหลดข้อมูลตะกร้า รองรับทั้งสองคีย์เพื่อป้องกันข้อมูลเป็นศูนย์
        const savedCart = localStorage.getItem('restaurantCart') || localStorage.getItem('cart');
        if (savedCart) {
            try {
                cart = JSON.parse(savedCart);
            } catch (e) {
                cart = [];
            }
        }

        // 2. แสดงกลุ่มลูกค้า
        const groupName = localStorage.getItem('selectedCustomerGroup') || '-';
        document.getElementById('customerGroupText').textContent = groupName;

        // 3. แสดงวันที่ปัจจุบัน
        const now = new Date();
        const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
        document.getElementById('orderDateText').textContent = dateStr;

        renderOrderTable();
    };

    function renderOrderTable() {
        const tbody = document.getElementById('orderTableBody');
        tbody.innerHTML = '';

        if (!cart || cart.length === 0) {
            tbody.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 text-slate-400">
                    <span class="text-3xl mb-2">🛒</span>
                    <p class="text-xs">ยังไม่มีรายการอาหารในตะกร้า</p>
                </div>
            `;
            document.getElementById('totalItemsSummaryText').textContent = '0 รายการ | 0 ชิ้น';
            document.getElementById('grandTotalPriceText').textContent = '0';
            return;
        }

        let totalQty = 0;
        let grandTotal = 0;

        cart.forEach((item, index) => {
            const qty = Number(item.qty || item.quantity || 1);
            const price = Number(item.price || 0);
            const itemTotal = price * qty;
            
            totalQty += qty;
            grandTotal += itemTotal;

            const row = document.createElement('div');
            row.className = 'grid grid-cols-12 p-2.5 items-center text-center hover:bg-slate-50';
            row.innerHTML = `
                <div class="col-span-5 text-left pl-1">
                    <div class="font-bold text-slate-800">${item.name}</div>
                    ${item.note ? `<div class="text-[10px] text-orange-600">note: ${item.note}</div>` : ''}
                </div>
                <div class="col-span-2 font-bold text-slate-700">${qty}</div>
                <div class="col-span-3 font-bold text-blue-600">${itemTotal.toLocaleString()}</div>
                <div class="col-span-2 flex justify-center">
                    <button type="button" onclick="removeItem(${index})" class="bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1 rounded-lg text-xs font-bold transition cursor-pointer">ลบ</button>
                </div>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('totalItemsSummaryText').textContent = `${cart.length} รายการ | ${totalQty} ชิ้น`;
        document.getElementById('grandTotalPriceText').textContent = grandTotal.toLocaleString();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('restaurantCart', JSON.stringify(cart));
        localStorage.setItem('cart', JSON.stringify(cart));
        renderOrderTable();
    }

    function confirmOrder() {
        if (!cart || cart.length === 0) {
            alert('กรุณาเลือกรายการอาหารก่อนยืนยันออร์เดอร์');
            return;
        }
        
        // บันทึกข้อมูลตะกร้าสำรองอีกครั้งก่อนเปลี่ยนหน้า
        localStorage.setItem('restaurantCart', JSON.stringify(cart));
        localStorage.setItem('cart', JSON.stringify(cart));

        // 🔗 พาเปลี่ยนหน้าไปยัง bill.html ที่คุณสร้างไว้
        window.location.href = 'bill.html';
    }
</script>
</body>
</html>
