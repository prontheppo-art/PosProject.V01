<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกกลุ่มลูกค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; }
        .simple-box { background: white; width: 90%; max-width: 360px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 24px; text-align: center; }
    </style>
</head>
<body>

<div class="simple-box">
    <!-- เอาหัวข้อข้อความออกตามที่คุณต้องการให้สะอาดตา -->
    <div class="space-y-3">
        <button type="button" onclick="selectGroupAndGo('ชาวบ้าน', 1)" class="w-full bg-white border-2 border-blue-500 text-blue-600 font-bold py-3.5 rounded-lg transition hover:bg-blue-50 active:bg-blue-100 cursor-pointer text-sm">
            🏠 ชาวบ้าน
        </button>
        <button type="button" onclick="selectGroupAndGo('นักท่องเที่ยว', 2)" class="w-full bg-white border-2 border-orange-500 text-orange-600 font-bold py-3.5 rounded-lg transition hover:bg-orange-50 active:bg-orange-100 cursor-pointer text-sm">
            🎒 นักท่องเที่ยว
        </button>
        <button type="button" onclick="selectGroupAndGo('สบายดี', 3)" class="w-full bg-white border-2 border-emerald-500 text-emerald-600 font-bold py-3.5 rounded-lg transition hover:bg-emerald-50 active:bg-emerald-100 cursor-pointer text-sm">
            🌿 สบายดี
        </button>
    </div>

    <button type="button" onclick="closePopup()" class="mt-6 text-slate-400 hover:text-slate-600 text-xs font-bold cursor-pointer underline">
        ยกเลิก
    </button>
</div>

<script>
    function selectGroupAndGo(groupName, groupId) {
        localStorage.setItem('customerGroupId', groupId);
        localStorage.setItem('customerGroupName', groupName);
        localStorage.setItem('selectedCustomerGroup', groupName);
        
        // ส่งสัญญาณบอกหน้าต่างหลักให้รีเฟชรข้อมูลทันที
        window.location.href = 'OrderTaking.html';
    }

    function closePopup() {
        window.location.href = 'OrderTaking.html';
    }
</script>
</body>
</html>
