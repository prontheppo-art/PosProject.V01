<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้ดูแลระบบ - ลาบหนองบัวลำภู</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            background: #ffffff;
            width: 96%;
            max-width: 500px;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            text-align: center;
        }

        .icon-top {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .store-title {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .store-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 28px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 52px;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            transition: transform 0.1s ease;
            box-sizing: border-box;
            width: 100%;
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        .btn-food { background: #2563eb; }
        .btn-price { background: #d97706; }
        .btn-stock-init { background: #ea580c; }
        .btn-mapping { background: #0d9488; }
        .btn-password { background: #334155; }
        .btn-home { background: #ef4444; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="icon-top">🔓</div>
        <div class="store-title">ผู้ดูแลระบบ</div>
        <div class="store-subtitle">จัดการระบบร้านอาหารและตรวจสอบยอดขาย</div>

        <div class="menu-list">
            <!-- 1. AddFood -->
            <a href="AddFood.html" class="menu-btn btn-food">
                <span>🍲 จัดการเมนูอาหาร & หมวดหมู่ (AddFood)</span>
            </a>
            <!-- 2. EditFood -->
            <a href="EditFood.html" class="menu-btn btn-price">
                <span>📋 ดูแลและแก้ไขตารางราคา (EditFood)</span>
            </a>
            <!-- 3. Stock Management -->
            <a href="stockmanagement.html" class="menu-btn btn-stock-init">
                <span>📦 การจัดการสต็อกสินค้า (Stock Management)</span>
            </a>
            <!-- 4. foodmapping -->
            <a href="foodmapping.html" class="menu-btn btn-mapping">
                <span>🔗 จัดการสูตรอาหาร & วัตถุดิบ (foodmapping)</span>
            </a>
            <!-- 5. changepwd -->
            <a href="changepwd.html" class="menu-btn btn-password">
                <span>🔑 เปลี่ยนรหัสผ่านแอดมิน (changepwd)</span>
            </a>
            <!-- 6. index -->
            <a href="index.html" class="menu-btn btn-home">
                <span>🏠 กลับหน้าหลัก (index)</span>
            </a>
        </div>
    </div>

</body>
</html>
