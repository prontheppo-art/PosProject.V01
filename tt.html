<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสต็อกสินค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="codekey.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4 min-h-screen flex items-start justify-center">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 h-[92vh] flex flex-col">
        
        <!-- ส่วนหัวและฟอร์มเพิ่มสินค้า (ย้ายปุ่มเพิ่มรายการขึ้นมาด้านบน และเปลี่ยนข้อความ) -->
        <div class="shrink-0 bg-white pb-3 z-10 space-y-3">
            <h2 class="text-base font-bold text-gray-800 text-center">📦 จัดการสต็อกสินค้า</h2>

            <div class="bg-orange-50 p-3 rounded-2xl border border-orange-100 space-y-2">
                <h3 class="text-xs font-bold text-orange-800">➕ เพิ่มรายการ</h3>
                <div class="flex gap-2">
                    <input type="text" id="newFoodName" placeholder="ชื่อเมนู เช่น เนื้อแดดเดียว" class="flex-1 p-2 border rounded-xl text-xs bg-white outline-none">
                    <input type="number" id="newFoodQty" placeholder="จำนวนตั้งต้น" class="w-24 p-2 border rounded-xl text-xs bg-white outline-none">
                </div>
                <button onclick="addStockItem()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 rounded-xl text-xs shadow">
                    + เพิ่มรายการใหม่
                </button>
            </div>
        </div>

        <hr class="border-gray-200 my-2 shrink-0">

        <!-- รายการสต็อกทั้งหมดแบบ 3 ช่อง (เลื่อนดูได้ตรงกลาง) -->
        <div id="stockListContainer" class="space-y-2 overflow-y-auto pr-1 flex-1 content-start mb-2">
            <div class="text-center text-xs text-gray-400 py-4">กำลังโหลดข้อมูล...</div>
        </div>

        <!-- ส่วนปุ่มควบคุมด้านล่างสุด -->
        <div class="shrink-0 pt-2 border-t border-gray-100 mt-auto">
            <div class="grid grid-cols-2 gap-2">
                <a href="adminmenu.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-1 shadow-xs">
                    🔑 กลับไปที่หน้าแอดมินเมนู
                </a>
                <button onclick="saveAllStocks()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                    💾 บันทึกการเติมสต็อก
                </button>
            </div>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async function() {
            await loadStocks();
        };

        async function loadStocks() {
            const container = document.getElementById('stockListContainer');
            try {
                const { data, error } = await db.from('food_stocks').select('*').order('food_name', { ascending: true });
                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center text-xs text-gray-400 py-4">ไม่มีสินค้าในสต็อก</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    let updateDate = item.updated_at ? new Date(item.updated_at).toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
                    
                    html += `
                        <div class="flex items-center justify-between p-2 bg-white border border-gray-100 rounded-2xl shadow-sm gap-1">
                            <button onclick="deleteStock(${item.id})" class="bg-red-100 text-red-600 hover:bg-red-200 w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shrink-0" title="ลบรายการ">✕</button>
                            <div class="flex-1 min-w-0 px-1">
                                <div class="font-bold text-xs text-gray-800 truncate">${item.food_name}</div>
                                <div class="text-[9px] text-gray-400">อัปเดต: ${updateDate}</div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <!-- ช่องคงเหลือ -->
                                <div class="text-center">
                                    <div class="text-[8px] text-gray-400">คงเหลือ</div>
                                    <input type="text" value="${item.quantity}" readonly class="w-10 p-1 border rounded-lg text-xs text-center font-bold bg-gray-100 text-gray-600">
                                </div>
                                <!-- ช่องเพิ่ม -->
                                <div class="text-center">
                                    <div class="text-[8px] text-orange-600 font-bold">เพิ่ม</div>
                                    <input type="number" id="add_${item.id}" oninput="calculateTotal(${item.id}, ${item.quantity})" placeholder="" class="w-10 p-1 border rounded-lg text-xs text-center font-bold bg-orange-50 focus:bg-white focus:border-orange-500 outline-none">
                                </div>
                                <!-- ช่องรวม -->
                                <div class="text-center">
                                    <div class="text-[8px] text-emerald-600 font-bold">รวม</div>
                                    <input type="text" id="total_${item.id}" value="${item.quantity}" readonly class="w-10 p-1 border rounded-lg text-xs text-center font-bold bg-emerald-50 text-emerald-700">
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="text-center text-xs text-red-500 py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            }
        }

        // คำนวณยอดรวมอัตโนมัติเมื่อพิมพ์ช่องเพิ่ม
        function calculateTotal(id, currentQty) {
            const addInput = document.getElementById(`add_${id}`);
            const totalInput = document.getElementById(`total_${id}`);
            let addVal = parseFloat(addInput.value);
            if (isNaN(addVal)) {
                addVal = 0;
            }
            totalInput.value = currentQty + addVal;
        }

        async function addStockItem() {
            const name = document.getElementById('newFoodName').value.trim();
            const qty = parseFloat(document.getElementById('newFoodQty').value);

            if (!name || isNaN(qty)) {
                alert('กรุณากรอกชื่อและจำนวนตั้งต้นให้ครบถ้วน');
                return;
            }

            try {
                const { error } = await db.from('food_stocks').insert([{ food_name: name, quantity: qty, updated_at: new Date().toISOString() }]);
                if (error) throw error;

                alert('✅ เพิ่มรายการสินค้าใหม่สำเร็จ');
                document.getElementById('newFoodName').value = '';
                document.getElementById('newFoodQty').value = '';
                loadStocks();
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }

        async function saveAllStocks() {
            if (!confirm('ยืนยันการบันทึกยอดรวมสต็อกทั้งหมดใช่หรือไม่?')) return;
            try {
                const inputs = document.querySelectorAll('input[id^="add_"]');
                let updatedCount = 0;

                for (let input of inputs) {
                    const addVal = parseFloat(input.value);

                    // ถ้ามีการกรอกช่องเพิ่มเข้ามา
                    if (!isNaN(addVal) && addVal !== 0) {
                        const id = input.id.replace('add_', '');
                        const totalInput = document.getElementById(`total_${id}`);
                        const newTotalQty = parseFloat(totalInput.value);

                        await db.from('food_stocks').update({ 
                            quantity: newTotalQty, 
                            updated_at: new Date().toISOString() 
                        }).eq('id', id);

                        updatedCount++;
                    }
                }

                if (updatedCount > 0) {
                    alert('✅ บันทึกยอดรวมสต็อกเรียบร้อยแล้ว');
                } else {
                    alert('ℹ️ไม่มีการเปลี่ยนแปลงจำนวน (ไม่ได้กรอกช่องเพิ่มสต็อก)');
                }
                
                loadStocks();
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }

        async function deleteStock(id) {
            if (!confirm('ต้องการลบรายการสินค้านี้ออกจากสต็อกใช่หรือไม่?')) return;
            try {
                const { error } = await db.from('food_stocks').delete().eq('id', id);
                if (error) throw error;
                loadStocks();
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }
    </script>
</body>
</html>
