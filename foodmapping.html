<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>จัดการสูตรอาหารและวัตถุดิบ (Food Mapping) - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="key.js"></script>
    <style>
        /* ล็อกหน้าจอไม่ให้ขยายหรือเลื่อนทั้งหน้า ป้องกันการยืดหดของ viewport บนมือถือ */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: #f3f4f6; /* bg-gray-100 */
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
        }

        /* จัดโครงสร้างให้อยู่กึ่งกลางหน้าจอพอดีและไม่หลุดเฟรม */
        .app-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100vw;
            box-sizing: border-box;
            padding: 16px;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="app-layout">
        <!-- กรอบหลัก Fix หน้าจอให้อยู่กับที่ (ความสูง 92vh) -->
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 h-[92vh] flex flex-col relative overflow-hidden">
            
            <!-- แถบหัวข้อด้านบน (ล็อกนิ่ง) -->
            <div class="shrink-0 bg-white pb-2 z-10 text-center">
                <h2 class="text-base font-bold text-gray-800">🔗 จัดการสูตรอาหารและวัตถุดิบ</h2>
            </div>

            <hr class="border-gray-200 my-2 shrink-0">

            <!-- ส่วนฟอร์มเพิ่ม/ผูกสูตรอาหาร (ล็อกนิ่ง) -->
            <div class="shrink-0 bg-white pb-3 space-y-3">
                <div class="bg-blue-50 p-3 rounded-2xl border border-blue-100 space-y-2">
                    <h3 class="text-xs font-bold text-blue-800">➕ เพิ่ม/ผูกสูตรอาหารกับวัตถุดิบ</h3>
                    <div class="space-y-2">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-0.5">วัตถุดิบ:</label>
                            <select id="stockSelect" class="w-full p-2 border rounded-xl text-xs bg-white outline-none">
                                <option value="">-- เลือกวัตถุดิบ --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-0.5">เมนูอาหาร:</label>
                            <select id="foodSelect" class="w-full p-2 border rounded-xl text-xs bg-white outline-none">
                                <option value="">-- เลือกเมนูอาหาร --</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="addMapping()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-xs shadow transition">
                        + บันทึกการเชื่อมโยงสูตร
                    </button>
                </div>
            </div>

            <!-- หัวข้อตารางรายการ (ล็อกนิ่ง) -->
            <div class="shrink-0 pt-2 pb-1 bg-white">
                <h3 class="text-xs font-bold text-gray-700">📋 รายการสูตรอาหารทั้งหมดในระบบ</h3>
            </div>

            <!-- 📜 ส่วนตารางรายการที่จะให้ Scroll เลื่อนได้เฉพาะส่วนนี้ (Scroll Lock) -->
            <div id="mappingList" class="overflow-y-auto pr-1 flex-1 content-start space-y-2 border border-gray-100 rounded-2xl p-2 bg-gray-50 mb-2">
                <div class="text-center text-xs text-gray-400 py-4">กำลังโหลดข้อมูล...</div>
            </div>

            <!-- ส่วนปุ่มควบคุมด้านล่างสุด (ล็อกติดขอบล่าง) -->
            <div class="shrink-0 pt-2 border-t border-gray-100 mt-auto">
                <a href="PageAdmin.html" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-1 shadow-xs block">
                    🔑 กลับผู้ดูแลระบบ
                </a>
            </div>
        </div>
    </div>

    <!-- 🌟 Custom Modal Popup ดีไซน์สวยงามแทน Alert เดิม -->
    <div id="customModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300 text-center space-y-4" id="modalBox">
            <div id="modalIconContainer" class="w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-blue-100 text-blue-600">
                💡
            </div>
            <div class="space-y-1">
                <h3 id="modalTitle" class="text-sm font-bold text-gray-800">แจ้งเตือน</h3>
                <p id="modalMessage" class="text-xs text-gray-500 leading-relaxed">ข้อความแจ้งเตือน</p>
            </div>
            <div id="modalActionContainer" class="flex gap-2 pt-2">
                <button id="modalCancelBtn" onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs transition hidden">
                    ยกเลิก
                </button>
                <button id="modalConfirmBtn" onclick="closeModal()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">
                    ตกลง
                </button>
            </div>
        </div>
    </div>

    <script>
        // ป้องกันการซูมหน้าจอด้วยนิ้ว (Pinch-to-zoom และ Gesture ทั้งหมด) อย่างเด็ดขาด
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async function() {
            await loadDropdowns();
            await loadMappings();
        };

        function showModal({ title = "แจ้งเตือน", message, type = "info", showCancel = false, onConfirm = null }) {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIconContainer = document.getElementById('modalIconContainer');
            const cancelBtn = document.getElementById('modalCancelBtn');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            if (type === 'success') {
                modalIconContainer.className = "w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-emerald-100 text-emerald-600";
                modalIconContainer.innerText = "✅";
                confirmBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition";
            } else if (type === 'error') {
                modalIconContainer.className = "w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-red-100 text-red-600";
                modalIconContainer.innerText = "❌";
                confirmBtn.className = "flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition";
            } else {
                modalIconContainer.className = "w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-blue-100 text-blue-600";
                modalIconContainer.innerText = "💡";
                confirmBtn.className = "flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition";
            }

            if (showCancel) {
                cancelBtn.classList.remove('hidden');
            } else {
                cancelBtn.classList.add('hidden');
            }

            confirmBtn.onclick = function() {
                closeModal();
                if (onConfirm) onConfirm();
            };

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            
            modal.classList.add('opacity-0');
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function loadDropdowns() {
            try {
                const { data: stocks } = await db.from('food_stocks').select('food_name').order('food_name');
                const stockSelect = document.getElementById('stockSelect');
                if (stocks) {
                    stocks.forEach(s => {
                        let opt = document.createElement('option');
                        opt.value = s.food_name;
                        opt.textContent = s.food_name;
                        stockSelect.appendChild(opt);
                    });
                }

                const { data: foods } = await db.from('foods').select('id, name').order('name');
                const foodSelect = document.getElementById('foodSelect');
                if (foods) {
                    foods.forEach(f => {
                        let opt = document.createElement('option');
                        opt.value = f.id;
                        opt.textContent = f.name;
                        foodSelect.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadMappings() {
            const listDiv = document.getElementById('mappingList');
            try {
                const { data, error } = await db
                    .from('food_mappings')
                    .select(`
                        id,
                        stock_name,
                        food_id,
                        foods ( name )
                    `)
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<div class="text-center text-xs text-gray-400 py-4">ยังไม่มีข้อมูลการผูกสูตร</div>';
                    return;
                }

                let html = `<table class="w-full text-xs text-left border-collapse bg-white rounded-xl overflow-hidden shadow-xs">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 border-b">
                            <th class="p-2">รหัส</th>
                            <th class="p-2">เมนูอาหาร</th>
                            <th class="p-2">วัตถุดิบ</th>
                            <th class="p-2 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody>`;

                data.forEach(m => {
                    const foodName = m.foods ? m.foods.name : '<span class="text-red-400">(เมนูถูกลบ)</span>';

                    html += `<tr class="border-b hover:bg-gray-50">
                        <td class="p-2 text-gray-500">#${m.id}</td>
                        <td class="p-2 font-bold text-gray-800">${foodName}</td>
                        <td class="p-2 text-blue-600">${m.stock_name}</td>
                        <td class="p-2 text-center">
                            <button onclick="deleteMapping(${m.id})" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold shadow-xs">ลบ</button>
                        </td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                listDiv.innerHTML = html;
            } catch (err) {
                console.error(err);
                listDiv.innerHTML = '<div class="text-center text-xs text-red-500 py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            }
        }

        async function addMapping() {
            const stockName = document.getElementById('stockSelect').value;
            const foodId = document.getElementById('foodSelect').value;

            if (!stockName || !foodId) {
                showModal({
                    title: "กรอกข้อมูลไม่ครบ",
                    message: "กรุณาเลือกวัตถุดิบและเมนูอาหารให้ครบถ้วน",
                    type: "error"
                });
                return;
            }

            try {
                const { error } = await db.from('food_mappings').insert([{ stock_name: stockName, food_id: foodId }]);
                if (error) throw error;

                showModal({
                    title: "สำเร็จ",
                    message: "บันทึกการเชื่อมโยงสูตรสำเร็จ",
                    type: "success"
                });
                document.getElementById('stockSelect').value = '';
                document.getElementById('foodSelect').value = '';
                loadMappings();
            } catch (err) {
                showModal({
                    title: "เกิดข้อผิดพลาด",
                    message: err.message,
                    type: "error"
                });
            }
        }

        async function deleteMapping(id) {
            showModal({
                title: "ยืนยันการลบ",
                message: "ต้องการลบการเชื่อมโยงนี้ใช่หรือไม่?",
                type: "error",
                showCancel: true,
                onConfirm: async () => {
                    try {
                        const { error } = await db.from('food_mappings').delete().eq('id', id);
                        if (error) throw error;
                        loadMappings();
                    } catch (err) {
                        showModal({
                            title: "เกิดข้อผิดพลาด",
                            message: err.message,
                            type: "error"
                        });
                    }
                }
            });
        }
    </script>
</body>
</html>
