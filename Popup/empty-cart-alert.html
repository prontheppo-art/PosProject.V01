<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งเตือนตะกร้าว่าง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>

    <div class="bg-white w-[90% max-w-[320px] rounded-2xl p-5 shadow-2xl border border-slate-100 text-center transform transition-all">
        <!-- ไอคอนแจ้งเตือน -->
        <div class="w-14 h-14 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
            🛒
        </div>
        
        <!-- ข้อความแจ้งเตือน -->
        <h3 class="font-bold text-slate-800 text-base mb-1">ยังไม่ได้เลือกรายการอาหาร</h3>
        <p class="text-xs text-slate-500 mb-5 leading-relaxed">
            กรุณาเลือกรายการอาหารอย่างน้อย 1 รายการ ก่อนดำเนินการไปยังหน้าตรวจสอบออร์เดอร์ครับ
        </p>

        <!-- ปุ่มกดปิดเพื่อกลับไปเลือกอาหาร -->
        <button onclick="closeAlert()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow transition cursor-pointer">
            ตกลง (กลับไปเลือกอาหาร)
        </button>
    </div>

    <script>
        function closeAlert() {
            // คำสั่งสำหรับปิด Modal ถ้าเรียกผ่าน Iframe หรือหน้าต่างซ้อน
            if (window.parent && typeof window.parent.closeEmptyCartModal === 'function') {
                window.parent.closeEmptyCartModal();
            } else {
                // กรณีเปิดแบบหน้าต่างทั่วไป
                history.back();
            }
        }
    </script>
</body>
</html>
