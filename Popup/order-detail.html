<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-transparent flex items-center justify-center h-screen">
    <div class="bg-white w-[320px] rounded-2xl p-5 shadow-2xl">
        <h3 class="text-sm font-bold border-b pb-2 mb-3">📋 รายละเอียดออร์เดอร์</h3>
        <div id="itemsContainer" class="space-y-2 text-xs"></div>
        <button onclick="window.parent.closeDetailModal()" class="w-full bg-slate-700 text-white py-2 mt-4 rounded-xl text-xs">ปิดหน้าต่าง</button>
    </div>

    <script>
        function loadItems(items) {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = items.map(i => `
                <div class="flex justify-between bg-gray-50 p-2 rounded-lg">
                    <span>${i.name} (x${i.qty})</span>
                    <span class="font-bold">${(i.price * i.qty).toLocaleString()} ฿</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
