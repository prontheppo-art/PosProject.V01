<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Category</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../root/key.js"></script>
</head>
<body class="bg-transparent m-0 p-1">
    <!-- ส่วนแสดงหมวดหมู่ทั้งหมด พร้อมระบบเลื่อน Scroll ขขึ้น-ลง -->
    <div id="categoryContainer" class="h-full overflow-y-auto pr-1 space-y-2">
        <div class="text-center text-gray-400 py-4 text-xs">กำลังโหลดหมวดหมู่...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadCategories();
        });

        async function loadCategories() {
            const container = document.getElementById('categoryContainer');

            const fallbackCategories = [
                { id: 1, name: 'ข้าว / ข้าวต้ม / ข้าวกล่อง' },
                { id: 2, name: 'ต้ม / แกง' },
                { id: 3, name: 'ลาบ / ก้อย / ตกหมู' },
                { id: 4, name: 'ยำ / ทอด / ผัด' },
                { id: 5, name: 'เครื่องดื่ม' },
                { id: 6, name: 'ของทานเล่น' }
            ];

            try {
                const { data, error } = await supabase.from('categories').select('id, name');
                
                if (error) throw error;

                const categoriesToRender = (data && data.length > 0) ? data : fallbackCategories;
                renderCategories(categoriesToRender);

            } catch (err) {
                console.error("Using fallback categories due to error:", err);
                renderCategories(fallbackCategories);
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';

            const gridDiv = document.createElement('div');
            gridDiv.className = "grid grid-cols-2 gap-2";

            const colors = [
                "bg-blue-600 hover:bg-blue-700",
                "bg-amber-700 hover:bg-amber-800",
                "bg-emerald-600 hover:bg-emerald-700",
                "bg-purple-600 hover:bg-purple-700",
                "bg-rose-600 hover:bg-rose-700",
                "bg-teal-600 hover:bg-teal-700"
            ];

            categories.forEach((cat, index) => {
                const colorClass = colors[index % colors.length];

                const btn = document.createElement('button');
                btn.type = 'button';
                /* เอาไอคอนออก ปรับ padding และจัดข้อให้อยู่ตรงกลางหรือสวยงามตามต้องการ */
                btn.className = `${colorClass} text-white p-3 rounded-xl text-left flex items-center shadow transition cursor-pointer min-h-[50px]`;
                btn.innerHTML = `
                    <span class="font-bold text-xs">${cat.name}</span>
                `;
                btn.onclick = () => {
                    if (window.parent && typeof window.parent.selectCategory === 'function') {
                        window.parent.selectCategory(cat.name);
                    }
                };
                gridDiv.appendChild(btn);
            });

            container.appendChild(gridDiv);
        }
    </script>
</body>
</html>
