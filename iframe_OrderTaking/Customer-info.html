<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../root/key.js"></script>
    <style>
        body { background: transparent; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs space-y-3">
        
        <!-- แถวที่ 1: เลือกกลุ่มลูกค้า -->
        <div>
            <div class="flex justify-between items-center mb-1.5">
                <span class="font-bold text-amber-900 text-sm">👥 เลือกกลุ่มลูกค้า:</span>
                <span id="selectedGroupBadge" class="bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full font-bold text-[11px]">ยังไม่ได้เลือก</span>
            </div>
            
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectCustomerGroup('ชาวบ้าน', 1)" id="btnGroup1" 
                        class="bg-white border-2 border-blue-500 text-blue-600 font-bold py-2 px-1 rounded-lg transition hover:bg-blue-50 active:bg-blue-100 cursor-pointer text-xs text-center truncate">
                    🏠 ชาวบ้าน
                </button>
                <button type="button" onclick="selectCustomerGroup('นักท่องเที่ยว', 2)" id="btnGroup2" 
                        class="bg-white border-2 border-orange-500 text-orange-600 font-bold py-2 px-1 rounded-lg transition hover:bg-orange-50 active:bg-orange-100 cursor-pointer text-xs text-center truncate">
                    🎒 นักท่องเที่ยว
                </button>
                <button type="button" onclick="selectCustomerGroup('สบายดี', 3)" id="btnGroup3" 
                        class="bg-white border-2 border-emerald-500 text-emerald-600 font-bold py-2 px-1 rounded-lg transition hover:bg-emerald-50 active:bg-emerald-100 cursor-pointer text-xs text-center truncate">
                    🌿 สบายดี
                </button>
            </div>
        </div>

        <!-- ส่วนข้อมูลจัดส่ง (แสดงเฉพาะเมื่อเลือกกลุ่ม "นักท่องเที่ยว") -->
        <div id="deliverySection" class="border-t border-amber-200 pt-2 hidden space-y-2">
            <div class="flex justify-between items-center">
                <span class="font-bold text-amber-900">📍 ข้อมูลจัดส่ง (สถานที่ / โซน)</span>
                <span id="phoneError" class="text-red-500 text-[10px] hidden">เบอร์โทรต้องครบ 10 หลัก</span>
            </div>
            
            <div class="grid grid-cols-3 gap-2">
                <input type="text" id="phoneInput" placeholder="เบอร์โทร 10 หลัก" maxlength="10" 
                       class="p-1.5 border rounded-lg text-center bg-white shadow-sm text-xs" 
                       oninput="validateAndSavePhone()">
                
                <button type="button" onclick="openLocationSelection()" class="p-1.5 border rounded-lg bg-white font-bold text-gray-700 text-left truncate shadow-sm cursor-pointer hover:bg-amber-100 transition">
                    <span id="selectedLocationText">-- สถานที่ --</span>
                </button>
                
                <button type="button" onclick="openZoneSelection()" class="p-1.5 border rounded-lg bg-white font-bold text-gray-700 text-left truncate shadow-sm cursor-pointer hover:bg-amber-100 transition">
                    <span id="selectedZoneText">-- โซน --</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal เลือกสถานที่ / โซน -->
    <div id="selectionModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-xs w-full p-4 space-y-3 shadow-lg">
            <h3 id="modalTitle" class="font-bold text-amber-900 text-sm text-center">เลือกสถานที่จัดส่ง</h3>
            <div id="modalListContainer" class="max-h-48 overflow-y-auto space-y-1.5 text-xs"></div>
            <button type="button" onclick="closeSelectionModal()" class="w-full bg-gray-200 text-gray-700 font-bold py-1.5 rounded-lg text-xs cursor-pointer">
                ปิด
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadSavedData();
            // ตรวจสอบการเปลี่ยนแปลงจากหน้าต่างอื่นแบบ Real-time
            window.addEventListener('storage', (e) => {
                if (e.key === 'customerGroupName' || e.key === 'selectedCustomerGroup') {
                    loadSavedData();
                }
            });
        });

        function selectCustomerGroup(groupName, groupId) {
            localStorage.setItem('customerGroupId', groupId);
            localStorage.setItem('customerGroupName', groupName);
            localStorage.setItem('selectedCustomerGroup', groupName);

            updateButtonGroupUI(groupName);
            toggleDeliverySection(groupName);

            if (window.parent && typeof window.parent.saveDeliveryInfo === 'function') {
                window.parent.saveDeliveryInfo();
            }
        }

        function updateButtonGroupUI(groupName) {
            const badge = document.getElementById('selectedGroupBadge');
            badge.textContent = groupName;

            ['1', '2', '3'].forEach(id => {
                document.getElementById('btnGroup' + id).classList.remove('ring-2', 'ring-offset-1', 'scale-95');
            });

            if (groupName === 'ชาวบ้าน') document.getElementById('btnGroup1').classList.add('ring-2', 'ring-blue-600');
            if (groupName === 'นักท่องเที่ยว') document.getElementById('btnGroup2').classList.add('ring-2', 'ring-orange-600');
            if (groupName === 'สบายดี') document.getElementById('btnGroup3').classList.add('ring-2', 'ring-emerald-600');
        }

        function toggleDeliverySection(groupName) {
            const deliverySection = document.getElementById('deliverySection');

            if (groupName === 'นักท่องเที่ยว') {
                deliverySection.classList.remove('hidden');
            } else {
                deliverySection.classList.add('hidden');
                localStorage.removeItem('customerPhone');
                localStorage.removeItem('customerLocation');
                localStorage.removeItem('customerZone');
                localStorage.removeItem('customerLocationId');
                localStorage.removeItem('customerZoneId');
                const phoneInput = document.getElementById('phoneInput');
                if (phoneInput) phoneInput.value = '';
                const locText = document.getElementById('selectedLocationText');
                if (locText) locText.textContent = '-- สถานที่ --';
                const zoneText = document.getElementById('selectedZoneText');
                if (zoneText) zoneText.textContent = '-- โซน --';
            }
        }

        function validateAndSavePhone() {
            const phoneInput = document.getElementById('phoneInput');
            const errorSpan = document.getElementById('phoneError');
            const phoneVal = phoneInput.value.trim();

            phoneInput.value = phoneVal.replace(/\D/g, '');

            if (phoneInput.value.length > 0 && phoneInput.value.length < 10) {
                errorSpan.classList.remove('hidden');
            } else {
                errorSpan.classList.add('hidden');
                localStorage.setItem('customerPhone', phoneInput.value);
                
                if (window.parent && typeof window.parent.saveDeliveryInfo === 'function') {
                    window.parent.saveDeliveryInfo();
                }
            }
        }

        async function openLocationSelection() {
            if (window.parent && typeof window.parent.openLocationModal === 'function') {
                window.parent.openLocationModal();
                return;
            }

            const modal = document.getElementById('selectionModal');
            const title = document.getElementById('modalTitle');
            const container = document.getElementById('modalListContainer');

            title.textContent = "📍 เลือกสถานที่ (รีสอร์ต)";
            container.innerHTML = '<div class="text-center text-gray-400 py-2">กำลังโหลดข้อมูล...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const fallbackLocations = [
                { id: 1, name: 'บาหลี รีสอร์ท' },
                { id: 2, name: 'บ้านเขาบ้านเรา' },
                { id: 3, name: 'เดอะไพนส์ รีสอร์ท' },
                { id: 4, name: 'ภูผาธารา' }
            ];

            try {
                const { data, error } = await supabase.from('locations').select('id, name');
                if (error) throw error;
                renderLocationList(data && data.length > 0 ? data : fallbackLocations);
            } catch (err) {
                renderLocationList(fallbackLocations);
            }
        }

        function renderLocationList(locations) {
            const container = document.getElementById('modalListContainer');
            container.innerHTML = '';
            
            locations.forEach(loc => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "w-full text-left p-2 border rounded-lg bg-gray-50 hover:bg-amber-100 font-bold text-gray-700 transition cursor-pointer";
                btn.textContent = loc.name;
                btn.onclick = () => {
                    localStorage.setItem('customerLocationId', loc.id);
                    localStorage.setItem('customerLocation', loc.name);
                    localStorage.removeItem('customerZoneId');
                    localStorage.removeItem('customerZone');
                    
                    document.getElementById('selectedLocationText').textContent = loc.name;
                    document.getElementById('selectedZoneText').textContent = '-- โซน --';
                    
                    closeSelectionModal();
                    if (window.parent && typeof window.parent.saveDeliveryInfo === 'function') {
                        window.parent.saveDeliveryInfo();
                    }
                };
                container.appendChild(btn);
            });
        }

        async function openZoneSelection() {
            if (window.parent && typeof window.parent.openZoneModal === 'function') {
                window.parent.openZoneModal();
                return;
            }

            const locationId = localStorage.getItem('customerLocationId');
            const locationName = localStorage.getItem('customerLocation');
            
            if (!locationId) {
                alert('กรุณาเลือก "สถานที่" ก่อนเลือก "โซน" ครับ');
                return;
            }

            const modal = document.getElementById('selectionModal');
            const title = document.getElementById('modalTitle');
            const container = document.getElementById('modalListContainer');

            title.textContent = `📌 เลือกโซนย่อย (${locationName})`;
            container.innerHTML = '<div class="text-center text-gray-400 py-2">กำลังโหลดข้อมูล...</div>';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const fallbackZones = [
                { id: 101, name: 'โซน A (ริมน้ำ)' },
                { id: 102, name: 'โซน B (สวนหย่อม)' },
                { id: 103, name: 'โซน VIP' }
            ];

            try {
                const { data, error } = await supabase
                    .from('zones')
                    .select('id, name')
                    .eq('location_id', locationId);

                if (error) throw error;
                renderZoneList(data && data.length > 0 ? data : fallbackZones);
            } catch (err) {
                renderZoneList(fallbackZones);
            }
        }

        function renderZoneList(zones) {
            const container = document.getElementById('modalListContainer');
            container.innerHTML = '';

            zones.forEach(zone => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "w-full text-left p-2 border rounded-lg bg-gray-50 hover:bg-amber-100 font-bold text-gray-700 transition cursor-pointer";
                btn.textContent = zone.name;
                btn.onclick = () => {
                    localStorage.setItem('customerZoneId', zone.id);
                    localStorage.setItem('customerZone', zone.name);
                    
                    document.getElementById('selectedZoneText').textContent = zone.name;
                    
                    closeSelectionModal();
                    if (window.parent && typeof window.parent.saveDeliveryInfo === 'function') {
                        window.parent.saveDeliveryInfo();
                    }
                };
                container.appendChild(btn);
            });
        }

        function closeSelectionModal() {
            const modal = document.getElementById('selectionModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function loadSavedData() {
            const savedGroup = localStorage.getItem('customerGroupName') || localStorage.getItem('selectedCustomerGroup') || 'ชาวบ้าน';
            updateButtonGroupUI(savedGroup);
            toggleDeliverySection(savedGroup);

            const phone = localStorage.getItem('customerPhone');
            if (phone && document.getElementById('phoneInput')) {
                document.getElementById('phoneInput').value = phone;
            }

            const loc = localStorage.getItem('customerLocation');
            if (loc && document.getElementById('selectedLocationText')) {
                document.getElementById('selectedLocationText').textContent = loc;
            }

            const zone = localStorage.getItem('customerZone');
            if (zone && document.getElementById('selectedZoneText')) {
                document.getElementById('selectedZoneText').textContent = zone;
            }
        }
    </script>
</body>
</html>
