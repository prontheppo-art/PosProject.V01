<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกหมวดหมู่รายการอาหาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: white; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="app-container">
        <h2 class="text-lg font-bold text-slate-800 mb-6 text-center">เลือกหมวดหมู่รายการอาหาร</h2>

        <!-- กลุ่มเมนู 6 ปุ่ม -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="selectCategory('ข้าว / ข้าวต้ม / ข้าวกล่อง')" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-6 px-4 rounded-xl shadow-md transition text-sm">📁 ข้าว / ข้าวต้ม / ข้าวกล่อง</button>
            <button onclick="selectCategory('ต้ม / แกง')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-6 px-4 rounded-xl shadow-md transition text-sm">📁 ต้ม / แกง</button>
            <button onclick="selectCategory('ทอด / ยำ')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-6 px-4 rounded-xl shadow-md transition text-sm">📁 ทอด / ยำ</button>
            <button onclick="selectCategory('ลาบ / ก้อย / ซอยจุ๊')" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-6 px-4 rounded-xl shadow-md transition text-sm">📁 ลาบ / ก้อย / ซอยจุ๊</button>
            <button onclick="selectCategory('ส้มตำ')" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-6 px-4 rounded-xl shadow-md transition text-sm">📁 ส้มตำ</button>
            <button onclick="selectCategory('เมนูพิเศษ')" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-6 px-4 rounded-xl shadow-md transition text-sm">📁 เมนูพิเศษ</button>
        </div>
    </div>

    <!-- Modal แสดงรายการอาหาร -->
    <div id="selectionModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl">
            <h3 id="modalTitle" class="font-bold text-lg text-slate-800 mb-4 text-center">เลือกรายการ</h3>
            <div id="modalListContainer" class="max-h-80 overflow-y-auto space-y-2"></div>
            <button onclick="closeModal()" class="w-full mt-4 bg-slate-200 py-2 rounded-lg font-bold text-slate-700">ปิด</button>
        </div>
    </div>

    <script>
        // ฐานข้อมูลรายการอาหารและราคาแยกตามกลุ่มลูกค้า
        const mockMenuData = {
            'ข้าว / ข้าวต้ม / ข้าวกล่อง': [
                { name: 'ข้าวผัดหมู', prices: { 'ชาวบ้าน': 50, 'นักท่องเที่ยว': 60, 'สบายดี': 55 } },
                { name: 'ข้าวต้มปลา', prices: { 'ชาวบ้าน': 60, 'นักท่องเที่ยว': 75, 'สบายดี': 65 } }
            ],
            'ต้ม / แกง': [
                { name: 'ต้มยำกุ้ง', prices: { 'ชาวบ้าน': 100, 'นักท่องเที่ยว': 120, 'สบายดี': 110 } }
            ],
            'ทอด / ยำ': [
                { name: 'ยำวุ้นเส้น', prices: { 'ชาวบ้าน': 70, 'นักท่องเที่ยว': 85, 'สบายดี': 75 } }
            ],
            'ลาบ / ก้อย / ซอยจุ๊': [
                { name: 'ลาบหมู', prices: { 'ชาวบ้าน': 70, 'นักท่องเที่ยว': 85, 'สบายดี': 75 } }
            ],
            'ส้มตำ': [
                { name: 'ตำปูปลาร้า', prices: { 'ชาวบ้าน': 40, 'นักท่องเที่ยว': 50, 'สบายดี': 45 } }
            ],
            'เมนูพิเศษ': [
                { name: 'ปลาทับทิมนึ่ง', prices: { 'ชาวบ้าน': 220, 'นักท่องเที่ยว': 250, 'สบายดี': 230 } }
            ]
        };

        function selectCategory(categoryName) {
            // ดึงกลุ่มลูกค้าที่เลือกไว้จาก localStorage (ถ้าไม่มีให้ default เป็น ชาวบ้าน)
            const currentGroup = localStorage.getItem('customerGroupName') || 'ชาวบ้าน';
            
            const modal = document.getElementById('selectionModal');
            const title = document.getElementById('modalTitle');
            const container = document.getElementById('modalListContainer');
            
            title.textContent = `${categoryName} (${currentGroup})`;
            container.innerHTML = '';

            const items = mockMenuData[categoryName] || [];
            
            items.forEach(dish => {
                const price = dish.prices[currentGroup] || dish.prices['ชาวบ้าน'];
                const btn = document.createElement('button');
                btn.className = "w-full flex justify-between items-center p-3 border rounded-lg hover:bg-amber-50 transition";
                btn.innerHTML = `<span>${dish.name}</span> <span class="font-bold text-green-600">${price} บาท</span>`;
                btn.onclick = () => {
                    alert(`เลือก: ${dish.name} ในราคา ${price} บาท`);
                    // ตรงนี้คุณสามารถเพิ่มโค้ดส่งค่าไปหน้า Order Tracking ได้เลยครับ
                    closeModal();
                };
                container.appendChild(btn);
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            document.getElementById('selectionModal').classList.add('hidden');
        }
    </script>
</body>
</html>
