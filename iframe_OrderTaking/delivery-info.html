<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: transparent; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-xs">
        <div class="font-bold text-amber-900 mb-1.5">📍 ข้อมูลจัดส่งนักท่องเที่ยว</div>
        <div class="grid grid-cols-3 gap-2">
            <input type="text" id="phoneInput" placeholder="เบอร์โทร 10 หลัก" maxlength="10" class="p-1.5 border rounded-lg text-center bg-white shadow-sm" oninput="parent.saveDeliveryInfo()">
            <button type="button" onclick="parent.openLocationModal()" class="p-1.5 border rounded-lg bg-white font-bold text-gray-700 text-left truncate shadow-sm cursor-pointer">
                <span id="selectedLocationText">-- เลือกสถานที่ --</span>
            </button>
            <button type="button" onclick="parent.openZoneModal()" class="p-1.5 border rounded-lg bg-white font-bold text-gray-700 text-left truncate shadow-sm cursor-pointer">
                <span id="selectedZoneText">-- เลือกโซน --</span>
            </button>
        </div>
    </div>
    <script>
        window.onload = () => {
            document.getElementById('phoneInput').value = localStorage.getItem('customerPhone') || '';
            const loc = localStorage.getItem('customerLocation');
            const zone = localStorage.getItem('customerZone');
            if(loc) document.getElementById('selectedLocationText').textContent = loc;
            if(zone) document.getElementById('selectedZoneText').textContent = zone;
        };
    </script>
</body>
</html>
