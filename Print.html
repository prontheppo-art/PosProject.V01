<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>ใบเสร็จรับเงิน / ใบสรุปออร์เดอร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เพิ่ม Script สำหรับสร้าง QR Code (QRCode.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* ล็อกหน้าจอไม่ให้ขยายหรือเลื่อนทั้งหน้า */
        html, body { 
            height: 100%; margin: 0; padding: 0; overflow: hidden; 
            font-family: sans-serif; background: #f4f6f9; 
            touch-action: pan-y; 
            -webkit-user-select: none; user-select: none;
        }

        .app-layout { 
            display: flex; align-items: center; justify-content: center; 
            height: 100dvh; width: 100vw; padding: 16px; box-sizing: border-box; 
        }

        .bill-container { 
            width: 100%; max-width: 420px; height: 95vh; background: #fff; 
            border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            padding: 20px; box-sizing: border-box; display: flex; flex-direction: column;
        }

        /* จัดแต่งตำแหน่ง QR Code ให้แสดงผลสวยงามพอดีกรอบ */
        #qrcode img {
            margin: 0 auto;
            display: block;
            width: 80px;
            height: 80px;
        }

        @media print {
            .no-print { display: none; }
            body { background: white; overflow: visible; }
            .bill-container { box-shadow: none; border-radius: 0; height: auto; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="bill-container">
            <div class="text-center mb-4 shrink-0">
                <h2 class="font-bold text-base text-slate-800">ลาบหนองบัวลำภู</h2>
                <div class="text-xs text-slate-500">โทร. 064-5654951</div>
                <div class="font-bold text-sm text-slate-700 mt-2">ใบสรุปออร์เดอร์</div>
                <div id="orderDateTime" class="text-xs text-slate-400">-</div>
            </div>

            <div class="border-b border-dashed border-slate-300 my-1 shrink-0"></div>

            <!-- ส่วนรายการอาหาร (Scroll ได้เฉพาะส่วนนี้) -->
            <div id="billItemList" class="space-y-2 my-2 text-xs flex-1 overflow-y-auto">
                <div class="text-center text-slate-400 py-4">กำลังโหลดข้อมูล...</div>
            </div>

            <div class="border-b border-dashed border-slate-300 my-1 shrink-0"></div>

            <div class="flex justify-between items-center text-xs font-bold text-slate-700 my-1 shrink-0">
                <span id="billSummaryCount">0 รายการ | 0 ชิ้น</span>
                <span id="billTotalPrice" class="text-emerald-700 text-sm">0 บาท</span>
            </div>

            <div class="border-b border-dashed border-slate-300 my-1 shrink-0"></div>

            <div class="text-center text-[10px] text-slate-600 my-2 shrink-0">
                <div>ชื่อบัญชี: นางสาวทัศวรรณ</div>
                <div>ธนาคารกรุงไทย: XXX-X-XXXXX-X</div>
                <div>พร้อมเพย์: 0645654951</div>
            </div>

            <!-- ส่วนแสดง QR Code พร้อมเพย์จริง -->
            <div class="flex justify-center my-1 shrink-0">
                <div id="qrcode" class="w-20 h-20 bg-slate-50 border flex items-center justify-center text-[9px] text-slate-400 rounded font-bold overflow-hidden">
                    [ QR Code ]
                </div>
            </div>

            <div class="text-center text-xs text-slate-500 my-1 shrink-0">ขอบคุณค่ะ</div>

            <button onclick="finishOrder()" class="no-print mt-2 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-4 rounded-xl text-xs w-full shadow-md active:scale-95 transition shrink-0 cursor-pointer">
                🖨️ พิมพ์ใบเสร็จ & จบออร์เดอร์
            </button>
        </div>
    </div>

    <script>
        // ป้องกันการซูมหน้าจอ
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchend', (e) => {
            const now = new Date().getTime();
            if (now - window.lastTouchEnd <= 300) e.preventDefault();
            window.lastTouchEnd = now;
        }, { passive: false });

        window.onload = function() {
            window.lastTouchEnd = 0;
            loadBillData();
        };

        // ฟังก์ชันสร้างมาตรฐาน PromptPay EMV Co Payload สำหรับสร้าง QR Code โอนเงิน
        function generatePayload(mobileNumber, amount) {
            let cleanPhone = mobileNumber.replace(/[^0-9]/g, '');
            if (cleanPhone.length === 10) {
                cleanPhone = "0066" + cleanPhone.substring(1);
            }
            
            let target = "";
            if (cleanPhone.length >= 13) {
                target = "02" + ("00" + cleanPhone.length).slice(-2) + cleanPhone;
            } else {
                target = "01" + ("00" + cleanPhone.length).slice(-2) + cleanPhone;
            }

            let data29 = "0016A000000677010111" + target;
            let amountStr = Number(amount).toFixed(2);
            
            let payload = 
                "000201" +
                "010211" +
                "29" + ("00" + data29.length).slice(-2) + data29 +
                "5802TH" +
                "5303764" +
                "54" + ("00" + amountStr.length).slice(-2) + amountStr +
                "6304";

            let crc = calculateCRC16(payload);
            return payload + crc;
        }

        function calculateCRC16(payload) {
            let crc = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                let x = ((crc >> 8) ^ payload.charCodeAt(i)) & 0xFF;
                x ^= x >> 4;
                crc = ((crc << 8) ^ (x << 12) ^ (x << 5) ^ x) & 0xFFFF;
            }
            let hex = crc.toString(16).toUpperCase();
            while (hex.length < 4) hex = "0" + hex;
            return hex;
        }

        function loadBillData() {
            let cart = JSON.parse(localStorage.getItem('lastCompletedOrder') || '[]');
            if (cart.length === 0) cart = JSON.parse(localStorage.getItem('restaurantCart') || '[]');

            const container = document.getElementById('billItemList');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-4">ไม่มีรายการอาหาร</div>`;
                return;
            }

            let foodItemCount = 0;
            let totalQty = 0;
            let totalPrice = 0;

            cart.forEach(item => {
                const itemName = item.name || '';
                const itemQty = Number(item.qty || 1);
                const itemPrice = Number(item.price || 0);
                let itemTotal = itemPrice * itemQty;
                
                totalPrice += itemTotal;

                const isDeliveryFee = itemName.includes('ค่าบริการจัดส่ง') || itemName.includes('ค่าจัดส่ง');
                if (!isDeliveryFee) {
                    foodItemCount += 1;
                    totalQty += itemQty;
                }

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center';
                div.innerHTML = `
                    <div class="pr-2">
                        <span class="font-medium text-slate-800">${itemName} x${itemQty}</span>
                        ${item.note ? `<div class="text-[9px] text-rose-500 font-semibold truncate">หมายเหตุ: ${item.note}</div>` : ''}
                    </div>
                    <span class="font-bold text-slate-700 whitespace-nowrap">${itemTotal} ฿</span>
                `;
                container.appendChild(div);
            });

            document.getElementById('billSummaryCount').textContent = `${foodItemCount} รายการ | ${totalQty} ชิ้น`;
            document.getElementById('billTotalPrice').textContent = `${totalPrice.toLocaleString()} บาท`;
            
            const now = new Date();
            document.getElementById('orderDateTime').textContent = 
                now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            // สร้าง QR Code พร้อมเพย์ตามยอดรวมสุทธิและเบอร์ 0645654951
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // ล้างข้อความ [ QR Code ] เดิมออก
            
            const promptpayNumber = "0645654951";
            const qrPayload = generatePayload(promptpayNumber, totalPrice);

            new QRCode(qrContainer, {
                text: qrPayload,
                width: 80,
                height: 80,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function finishOrder() {
            window.print();
            const keysToRemove = ['lastCompletedOrder', 'restaurantCart', 'customerPhone', 'customerLocation', 'customerZone', 'selectedCustomerGroup'];
            keysToRemove.forEach(k => localStorage.removeItem(k));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
