<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าสต็อกสินค้าแบบเลือกจากรายการ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 40px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="mb-4 text-center">📝 จัดการสต็อกสินค้า (เลือกจากรายการอาหาร)</h2>

        <!-- ส่วนที่ 1: เลือกชื่อสินค้าจาก Dropdown และใส่จำนวน -->
        <div class="card p-4 mb-4 bg-white">
            <h5 class="text-primary mb-3">➕ 1. เพิ่ม/กำหนดสต็อกสินค้าจากรายการที่มี</h5>
            <div class="row g-2">
                <div class="col-md-7">
                    <!-- เปลี่ยนเป็น Dropdown List -->
                    <select id="newFoodName" class="form-select">
                        <option value="" selected disabled>-- กำลังโหลดรายการอาหารจากระบบ... --</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" id="newFoodQty" class="form-control text-center" placeholder="จำนวนชิ้น" min="0" value="0">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="addNewItem()">เพิ่มสต็อก</button>
                </div>
            </div>
        </div>

        <!-- ส่วนที่ 2: ลิสต์รายการสต็อกทั้งหมดที่มีอยู่แล้ว และให้กรอกตัวเลขแก้ได้ทันที -->
        <div class="card p-4 bg-white">
            <h5 class="text-success mb-3">📋 2. รายการสต็อกปัจจุบันในระบบ</h5>
            <p class="text-muted small">พิมพ์ตัวเลขจำนวนชิ้นที่คุณมีอยู่จริงลงในช่อง แล้วกดปุ่ม "อัปเดต" ด้านหลังได้เลย</p>
            
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th>ชื่อรายการสินค้า / วัตถุดิบ</th>
                        <th style="width: 150px;" class="text-center">จำนวนชิ้นที่มีอยู่</th>
                        <th style="width: 100px;" class="text-center">บันทึก</th>
                    </tr>
                </thead>
                <tbody id="rawStockList">
                    <tr><td colspan="4" class="text-center text-muted">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
            
            <a href="index.html" class="btn btn-secondary mt-3">กลับหน้าหลัก</a>
        </div>
    </div>

    <script>
        // --- ใส่ URL และ KEY ของ Supabase ตรงนี้ ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // โหลดข้อมูลทั้งหมดเมื่อเปิดหน้าเว็บ
        window.onload = function() {
            loadFoodDropdown();
            loadAllStocks();
        };

        // 1. ดึงชื่อเมนูอาหารจากตาราง 'foods' มาใส่ใน Dropdown
        async function loadFoodDropdown() {
            const selectEl = document.getElementById('newFoodName');
            
            const { data, error } = await supabaseClient
                .from('foods')
                .select('name')
                .order('name', { ascending: true });

            if (error) {
                console.error('Error loading foods:', error);
                selectEl.innerHTML = `<option value="" disabled>เกิดข้อผิดพลาดในการโหลดชื่ออาหาร</option>`;
                return;
            }

            if (!data || data.length === 0) {
                selectEl.innerHTML = `<option value="" disabled>ไม่พบรายการอาหารในตาราง foods</option>`;
                return;
            }

            selectEl.innerHTML = `<option value="" selected disabled>-- เลือกรายการอาหาร --</option>`;
            data.forEach((food) => {
                selectEl.innerHTML += `<option value="${food.name}">${food.name}</option>`;
            });
        }

        // 2. ดึงรายการสต็อกทั้งหมดจากตาราง 'food_stocks' มาแสดง
        async function loadAllStocks() {
            const tbody = document.getElementById('rawStockList');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">กำลังโหลดข้อมูล...</td></tr>`;

            const { data, error } = await supabaseClient
                .from('food_stocks')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">เกิดข้อผิดพลาด: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-warning">ยังไม่มีรายการสต็อกในระบบ เลือกจากด้านบนเพื่อเพิ่มได้เลย</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            
            data.forEach((item) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="text-muted">${item.id}</td>
                        <td class="fw-bold">${item.food_name}</td>
                        <td class="text-center">
                            <input type="number" id="qty_${item.id}" class="form-control text-center" value="${item.quantity}" min="0">
                        </td>
                        <td class="text-center">
                            <button class="btn btn-success btn-sm w-100" onclick="updateItem(${item.id}, '${item.food_name}')">อัปเดต</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. ฟังก์ชันอัปเดตจำนวนสินค้า
        async function updateItem(id, name) {
            const qtyInput = document.getElementById(`qty_${id}`).value;
            const newQty = parseInt(qtyInput);

            if (isNaN(newQty) || newQty < 0) {
                alert('กรุณาใส่ตัวเลขให้ถูกต้อง');
                return;
            }

            const { error } = await supabaseClient
                .from('food_stocks')
                .update({ quantity: newQty, updated_at: new Date() })
                .eq('id', id);

            if (error) {
                alert('อัปเดตไม่สำเร็จ: ' + error.message);
            } else {
                alert(`บันทึกจำนวนของ [${name}] เป็น ${newQty} ชิ้น เรียบร้อย!`);
                loadAllStocks();
            }
        }

        // 4. เพิ่มรายการใหม่ลงใน food_stocks โดยดึงค่าจาก Dropdown
        async function addNewItem() {
            const selectEl = document.getElementById('newFoodName');
            const name = selectEl.value;
            const qty = parseInt(document.getElementById('newFoodQty').value);

            if (!name) {
                alert('กรุณาเลือกรายการอาหารจาก Dropdown ก่อนครับ!');
                return;
            }
            if (isNaN(qty) || qty < 0) {
                alert('กรุณาระบุจำนวนชิ้นให้ถูกต้อง');
                return;
            }

            const { error } = await supabaseClient
                .from('food_stocks')
                .insert([{ food_name: name, quantity: qty }]);

            if (error) {
                alert('เพิ่มรายการไม่สำเร็จ (อาจมีรายการนี้ในสต็อกอยู่แล้ว): ' + error.message);
            } else {
                selectEl.selectedIndex = 0;
                document.getElementById('newFoodQty').value = '0';
                alert(`เพิ่ม [${name}] จำนวน ${qty} ชิ้น เข้าไปในระบบสต็อกแล้ว!`);
                loadAllStocks();
            }
        }
    </script>
</body>
</html>
