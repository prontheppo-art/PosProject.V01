<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>จัดการสต็อกสินค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="key.js"></script>
    <style>
        /* ล็อกหน้าจอไม่ให้ขยายหรือเลื่อนทั้งหน้า */
        html, body { 
            height: 100%; margin: 0; padding: 0; overflow: hidden; 
            font-family: sans-serif; background: #f3f4f6; 
            touch-action: pan-y; 
            -webkit-user-select: none; user-select: none;
        }

        .app-layout { 
            display: flex; align-items: center; justify-content: center; 
            height: 100dvh; width: 100vw; padding: 16px; box-sizing: border-box; 
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="app-layout">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 h-[92vh] flex flex-col relative overflow-hidden">
            
            <!-- ส่วนหัวและฟอร์มเพิ่มสินค้า (ล็อกนิ่ง) -->
            <div class="shrink-0 bg-white pb-3 z-10 space-y-3">
                <h2 class="text-base font-bold text-gray-800 text-center">📦 จัดการสต็อกสินค้า</h2>

                <div class="bg-orange-50 p-3 rounded-2xl border border-orange-100 space-y-2">
                    <h3 class="text-xs font-bold text-orange-800">➕ เพิ่มรายการ</h3>
                    <div class="flex gap-2">
                        <input type="text" id="newFoodName" placeholder="ชื่อเมนู เช่น เนื้อแดดเดียว" class="flex-1 p-2 border rounded-xl text-xs bg-white outline-none">
                        <input type="number" id="newFoodQty" placeholder="จำนวนตั้งต้น" class="w-24 p-2 border rounded-xl text-xs bg-white outline-none">
                    </div>
                    <button onclick="addStockItem()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 rounded-xl text-xs shadow cursor-pointer transition">
                        + เพิ่มรายการใหม่
                    </button>
                </div>
            </div>

            <hr class="border-gray-200 my-2 shrink-0">

            <!-- รายการสต็อกทั้งหมด (Scroll ได้เฉพาะส่วนนี้) -->
            <div id="stockListContainer" class="space-y-2 overflow-y-auto pr-1 flex-1 content-start mb-2">
                <div class="text-center text-xs text-gray-400 py-4">กำลังโหลดข้อมูล...</div>
            </div>

            <!-- ส่วนปุ่มควบคุมด้านล่างสุด (ล็อกติดขอบล่าง) -->
            <div class="shrink-0 pt-2 border-t border-gray-100 mt-auto bg-white">
                <a href="PageAdmin.html" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-1 shadow-xs block no-underline cursor-pointer">
                    🔑 กลับไปที่หน้าแอดมินเมนู
                </a>
            </div>
        </div>
    </div>

    <!-- 🌟 Custom Modal Popup -->
    <div id="customModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300 text-center space-y-4" id="modalBox">
            <div id="modalIconContainer" class="w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-orange-100 text-orange-600">
                ⚠️
            </div>
            
            <div class="space-y-1">
                <h3 id="modalTitle" class="text-sm font-bold text-gray-800">แจ้งเตือน</h3>
                <p id="modalMessage" class="text-xs text-gray-500 leading-relaxed">ข้อความแจ้งเตือนจะแสดงตรงนี้</p>
            </div>

            <div id="modalActionContainer" class="flex gap-2 pt-2">
                <button id="modalCancelBtn" onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs transition hidden cursor-pointer">
                    ยกเลิก
                </button>
                <button id="modalConfirmBtn" onclick="closeModal()" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition cursor-pointer">
                    ตกลง
                </button>
            </div>
        </div>
    </div>

    <script>
        // ป้องกันการซูมหน้าจอด้วยนิ้ว (Pinch-to-zoom และ Gesture ทั้งหมด) อย่างเด็ดขาด
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchend', (e) => {
            const now = new Date().getTime();
            if (now - window.lastTouchEnd <= 300) e.preventDefault();
            window.lastTouchEnd = now;
        }, { passive: false });

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async function() {
            window.lastTouchEnd = 0;
            await loadStocks();
        };

        function showModal({ title = "แจ้งเตือน", message, type = "info", showCancel = false, onConfirm = null }) {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIconContainer = document.getElementById('modalIconContainer');
            const cancelBtn = document.getElementById('modalCancelBtn');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            if (type === 'success') {
                modalIconContainer.className = "w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-emerald-100 text-emerald-600";
                modalIconContainer.innerText = "✅";
                confirmBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition cursor-pointer";
            } else if (type === 'error') {
                modalIconContainer.className = "w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-red-100 text-red-600";
                modalIconContainer.innerText = "❌";
                confirmBtn.className = "flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition cursor-pointer";
            } else {
                modalIconContainer.className = "w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-orange-100 text-orange-600";
                modalIconContainer.innerText = "💡";
                confirmBtn.className = "flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition cursor-pointer";
            }

            if (showCancel) {
                cancelBtn.classList.remove('hidden');
            } else {
                cancelBtn.classList.add('hidden');
            }

            confirmBtn.onclick = function() {
                closeModal();
                if (onConfirm) onConfirm();
            };

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            
            modal.classList.add('opacity-0');
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function loadStocks() {
            const container = document.getElementById('stockListContainer');
            try {
                const { data, error } = await db.from('food_stocks').select('*').order('food_name', { ascending: true });
                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center text-xs text-gray-400 py-4">ไม่มีสินค้าในสต็อก</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    let updateDate = item.updated_at ? new Date(item.updated_at).toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
                    
                    html += `
                        <div class="flex items-center justify-between p-2 bg-white border border-gray-100 rounded-2xl shadow-sm gap-1">
                            <button onclick="deleteStock(${item.id})" class="bg-red-100 text-red-600 hover:bg-red-200 w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shrink-0 cursor-pointer" title="ลบรายการ">✕</button>
                            <div class="flex-1 min-w-0 px-1">
                                <div class="font-bold text-xs text-gray-800 truncate">${item.food_name}</div>
                                <div class="text-[9px] text-gray-400">อัปเดต: ${updateDate}</div>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <div class="text-center">
                                    <div class="text-[8px] text-gray-400">คงเหลือ</div>
                                    <input type="text" value="${item.quantity}" readonly class="w-10 p-1 border rounded-lg text-xs text-center font-bold bg-gray-100 text-gray-600">
                                </div>
                                <div class="text-center">
                                    <div class="text-[8px] text-orange-600 font-bold">เพิ่ม</div>
                                    <input type="number" id="add_${item.id}" placeholder="" class="w-10 p-1 border rounded-lg text-xs text-center font-bold bg-orange-50 focus:bg-white focus:border-orange-500 outline-none">
                                </div>
                                <div class="text-center">
                                    <div class="text-[8px] text-emerald-600 font-bold">รวม</div>
                                    <button onclick="confirmAddStock(${item.id}, ${item.quantity})" class="w-8 h-7 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold rounded-lg text-sm flex items-center justify-center shadow-sm transition cursor-pointer">
                                        +
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="text-center text-red-500 py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            }
        }

        async function confirmAddStock(id, currentQty) {
            const addInput = document.getElementById(`add_${id}`);
            let addVal = parseFloat(addInput.value);

            if (isNaN(addVal) || addVal <= 0) {
                showModal({
                    title: "ข้อมูลไม่ถูกต้อง",
                    message: "กรุณากรอกจำนวนที่ต้องการเพิ่มให้ถูกต้อง",
                    type: "error"
                });
                return;
            }

            const newTotalQty = currentQty + addVal;

            try {
                const { error } = await db.from('food_stocks').update({ 
                    quantity: newTotalQty, 
                    updated_at: new Date().toISOString() 
                }).eq('id', id);

                if (error) throw error;
                
                loadStocks();
            } catch (err) {
                showModal({
                    title: "เกิดข้อผิดพลาด",
                    message: err.message,
                    type: "error"
                });
            }
        }

        async function addStockItem() {
            const name = document.getElementById('newFoodName').value.trim();
            const qty = parseFloat(document.getElementById('newFoodQty').value);

            if (!name || isNaN(qty)) {
                showModal({
                    title: "กรอกข้อมูลไม่ครบ",
                    message: "กรุณากรอกชื่อและจำนวนตั้งต้นให้ครบถ้วน",
                    type: "error"
                });
                return;
            }

            try {
                const { error } = await db.from('food_stocks').insert([{ food_name: name, quantity: qty, updated_at: new Date().toISOString() }]);
                if (error) throw error;

                showModal({
                    title: "สำเร็จ",
                    message: "เพิ่มรายการสินค้าใหม่สำเร็จ",
                    type: "success"
                });
                document.getElementById('newFoodName').value = '';
                document.getElementById('newFoodQty').value = '';
                loadStocks();
            } catch (err) {
                showModal({
                    title: "เกิดข้อผิดพลาด",
                    message: err.message,
                    type: "error"
                });
            }
        }

        async function deleteStock(id) {
            showModal({
                title: "ยืนยันการลบ",
                message: "ต้องการลบรายการสินค้านี้ออกจากสต็อกใช่หรือไม่?",
                type: "error",
                showCancel: true,
                onConfirm: async () => {
                    try {
                        const { error } = await db.from('food_stocks').delete().eq('id', id);
                        if (error) throw error;
                        loadStocks();
                    } catch (err) {
                        showModal({
                            title: "เกิดข้อผิดพลาด",
                            message: err.message,
                            type: "error"
                        });
                    }
                }
            });
        }
    </script>
</body>
</html>
