<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>ระบบจัดการเมนูอาหาร</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- เรียกไฟล์ CSS ภายนอก -->
    <link rel="stylesheet" href="style-addfood.css">
</head>
<body class="bg-gray-100 flex items-start justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 h-[92vh] app-layout">
        
        <!-- ส่วนหัวและฟอร์มด้านบน (หน้า 1) -->
        <div class="header-section pb-3">
            <h2 class="text-xl font-bold text-red-600 text-center mb-3">ระบบจัดการเมนูอาหาร</h2>
            
            <div class="space-y-2.5">
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-bold text-gray-700">หมวดหมู่</label>
                        <button type="button" onclick="openCategoryManagerModal()" class="text-[10px] font-bold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-2 py-0.5 rounded-lg transition items-center gap-1 shadow-2xs">
                            ✏️ จัดการกลุ่มรายการ
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="relative">
                        <button type="button" onclick="toggleDropdown()" id="categorySelectBtn" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-white font-medium text-left flex items-center justify-between shadow-2xs">
                            <span id="selectedCategoryText" class="truncate text-gray-700">-- แสดงทั้งหมด --</span>
                            <span class="text-gray-400 text-[10px] shrink-0 ml-1">▼</span>
                        </button>
                        
                        <div id="categoryDropdownPopup" class="hidden absolute left-0 top-full mt-1.5 bg-white border border-gray-200 rounded-2xl shadow-2xl z-50 p-2 space-y-1 w-max min-w-full"></div>
                    </div>

                    <input type="text" id="menuNameInput" placeholder="เช่น ส้มตำไทย" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ราคาตามกลุ่มลูกค้า:</label>
                    <div id="priceInputsContainer" class="grid grid-cols-3 gap-1.5 max-h-28 overflow-y-auto pr-1">
                        <div class="col-span-3 text-center text-gray-400 text-xs py-2">⏳ กำลังโหลดกลุ่มลูกค้า...</div>
                    </div>
                </div>
            </div>
            
            <hr class="border-gray-200 my-2">
            <div class="text-xs font-bold text-gray-700 mb-2">
                <span class="text-red-500">❌</span> เพื่อลบ / แตะเพื่อแก้ไขข้อมูล:
            </div>
        </div>
        
        <!-- รายการเมนูอาหาร (หน้า 2) -->
        <div class="content-section">
            <div id="menuListContainer" class="grid grid-cols-2 gap-2 pr-1 content-start">
                <div class="col-span-2 text-center text-gray-400 text-xs py-4">⏳ กำลังโหลดรายการเมนู...</div>
            </div>
        </div>

        <!-- ส่วนปุ่มควบคุมด้านล่างสุด -->
        <div class="footer-section pt-2 border-t border-gray-100 mt-auto">
            <div class="grid grid-cols-2 gap-2">
                <a href="PageAdmin.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-1 shadow-xs">
                    🔑 กลับผู้ดูแลระบบ
                </a>
                <button onclick="handleSaveMenu()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                    💾 บันทึก
                </button>
            </div>
        </div>
    </div>

    <!-- Modal จัดการกลุ่มรายการ (เพิ่ม / แก้ไข / ลบ) -->
    <div id="editCategoryModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 animate-fade-in">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 flex flex-col space-y-4 max-h-[85vh]">
            
            <!-- ส่วนหัว Modal -->
            <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-lg shadow-inner">📁</div>
                    <div>
                        <h3 class="font-bold text-sm text-gray-800">จัดการกลุ่มรายการอาหาร</h3>
                        <p class="text-[10px] text-gray-400">เพิ่มกลุ่มใหม่ หรือเลือกแก้ไขกลุ่มเดิม</p>
                    </div>
                </div>
                <button onclick="closeModal('editCategoryModal')" class="w-8 h-8 bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full flex items-center justify-center text-xs transition">✕</button>
            </div>

            <!-- ฟอร์มกรอกชื่อ (เพิ่มหรือแก้ไข) -->
            <div class="bg-gray-50 p-3 rounded-2xl border border-gray-200 space-y-2">
                <div class="flex justify-between items-center">
                    <label id="catFormLabel" class="text-[11px] font-bold text-indigo-600">➕ เพิ่มกลุ่มรายการใหม่</label>
                    <button type="button" id="cancelEditCatBtn" onclick="resetCategoryForm()" class="hidden text-[10px] text-red-500 hover:underline">ยกเลิกการแก้ไข</button>
                </div>
                <input type="hidden" id="editingCategoryId" value="">
                <div class="flex gap-2">
                    <input type="text" id="editCategoryInput" placeholder="ระบุชื่อกลุ่มรายการ..." class="flex-1 border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-white font-medium text-gray-800 focus:border-indigo-500 transition">
                    <button onclick="handleSaveCategoryAction()" id="saveCatBtnText" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm shrink-0">เพิ่ม</button>
                </div>
            </div>

            <!-- รายการกลุ่มที่มีอยู่ -->
            <div class="flex-1 overflow-y-auto space-y-1.5 pr-1 min-h-[140px] max-h-[220px]" id="modalCategoryListContainer"></div>

            <!-- ปุ่มปิดด้านล่าง -->
            <button onclick="closeModal('editCategoryModal')" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Modal ย้ายกลุ่ม / แก้ไขเมนู -->
    <div id="moveCategoryModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-left space-y-3">
            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-1 shadow-inner">✏️</div>
            <h3 class="font-bold text-sm text-gray-800 text-center">จัดการรายการอาหาร</h3>
            <div class="space-y-2">
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">ชื่อเมนูอาหาร:</label>
                    <input type="text" id="editMenuNameInput" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-gray-50 font-medium text-gray-800">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">กลุ่มรายการ (หมวดหมู่):</label>
                    <select id="targetCategorySelect" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-gray-50 font-medium text-gray-800"></select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeModal('moveCategoryModal')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition text-center">ยกเลิก</button>
                <button onclick="handleUpdateMenu()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition text-center">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="alertModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-center space-y-3">
            <div id="alertIcon" class="text-3xl mb-1">⚠️</div>
            <h3 id="alertTitle" class="font-bold text-sm text-gray-800">แจ้งเตือน</h3>
            <p id="alertMessage" class="text-xs text-gray-600">ข้อความ...</p>
            <button onclick="closeModal('alertModal')" class="w-full bg-red-600 text-white font-bold py-2 rounded-xl text-xs">ตกลง</button>
        </div>
    </div>

    <!-- โหลดไฟล์คีย์และไฟล์ JavaScript ภายนอกตามลำดับความสำคัญ -->
    <script src="key.js"></script>
    <script src="script-addfood.js"></script>
</body>
</html>
