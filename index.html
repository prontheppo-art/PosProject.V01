<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>ลาบหนองบัวลำภู @เขื่อนขุนด่านปราการชล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: #f4f6f9; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-layout { 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            max-width: 500px; 
            width: 100vw;
            margin: 0 auto; 
            background: #fff; 
            box-sizing: border-box; 
            padding: 20px 16px; 
            justify-content: flex-start; 
            align-items: center; 
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="app-layout shadow-xl">
    <!-- ส่วนหัว ล็อกติดด้านบน ปรับความสูงไอคอนเพิ่มอีกเท่าตัว (จาก w-18 h-18 เป็น w-18 h-36 และโค้งมนแบบแคปซูลแนวตั้ง) -->
    <div class="w-full text-center pt-2 pb-4 flex flex-col items-center shrink-0 border-b border-gray-100 mb-4">
        <div class="w-18 h-36 bg-blue-50 rounded-full flex items-center justify-center text-4xl mb-2 shadow-inner">🍽️</div>
        <h1 class="font-extrabold text-sm text-slate-800 mb-0.5">ลาบหนองบัวลำภู @เขื่อนขุนด่านปราการชล</h1>
        <p class="text-[10px] text-gray-500 font-medium">ระบบจัดการร้านอาหารและสั่งอาหาร</p>
    </div>

    <!-- ปุ่มเมนูต่างๆ (ขยายตัวหนังสือเพิ่มขึ้น 25% จาก text-xs เป็น text-sm และปรับ Padding ให้รับกัน) -->
    <div class="w-full space-y-3">
        <button type="button" onclick="goToPage('TakeOrder.html')" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer">
            <span class="text-base">📝</span> หน้าสั่งอาหาร
        </button>

        <a href="SalesReport.html" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer no-underline block text-center">
            <span class="text-base">📊</span> สรุปยอดขาย & ประวัติออร์เดอร์
        </a>

        <button type="button" onclick="goToPage('inventory.html')" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer">
            <span class="text-base">📦</span> สต็อกสินค้าคงเหลือ
        </button>

        <button type="button" onclick="goToPage('PageAdmin.html')" class="w-full bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer">
            <span class="text-base">🔒</span> ผู้ดูแลระบบ
        </button>
    </div>
</div>

<script>
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    function goToPage(url) {
        window.location.href = url;
    }
</script>
</body>
</html>
