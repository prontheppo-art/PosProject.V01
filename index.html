<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>ลาบหนองบัวลำภู @เขื่อนขุนด่านปราการชล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ล็อกหน้าจอไม่ให้ขยายหรือเลื่อนทั้งหน้า ป้องกันการยืดหดของ viewport บนมือถือ */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: #f4f6f9; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
        }

        /* จัดโครงสร้างให้หัวข้อชิดด้านบน (Top-aligned) และอยู่กึ่งกลางในแนวนอน */
        .app-layout { 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            max-width: 500px; 
            width: 100vw;
            margin: 0 auto; 
            background: #fff; 
            box-sizing: border-box; 
            padding: 16px 16px; 
            justify-content: flex-start; 
            align-items: center; 
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="app-layout shadow-xl">
    <!-- ส่วนหัว (แบ่งเป็น 2 บรรทัด และขยายขนาดใหญ่ขึ้นประมาณ 50%) -->
    <div class="w-full text-center pt-1 pb-3 flex flex-col items-center shrink-0 border-b border-gray-100 mb-3">
        <h1 class="font-extrabold text-xl text-slate-900 leading-snug">ลาบหนองบัวลำภู</h1>
        <h2 class="font-bold text-base text-slate-700 mt-1">@เขื่อนขุนด่านปราการชล</h2>
        <p class="text-[10px] text-gray-500 font-medium mt-1">ระบบจัดการร้านอาหารและสั่งอาหาร</p>
    </div>

    <!-- ปุ่มเมนูต่างๆ -->
    <div class="w-full space-y-2.5 overflow-y-auto">
        <!-- 1. หน้าสั่งอาหาร -->
        <button type="button" onclick="goToPage('TakeOrder.html')" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer shrink-0">
            <span class="text-base">📝</span> หน้าสั่งอาหาร
        </button>

        <!-- 2. สรุปออเดอร์รายวัน -->
        <button type="button" onclick="goToPage('SaleReportByDay.html')" class="w-full bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer shrink-0">
            <span class="text-base">📋</span> สรุปออเดอร์รายวัน
        </button>

        <!-- 3. สรุปตามกลุ่มลูกค้า -->
        <button type="button" onclick="goToPage('SalesReportByGroup.html')" class="w-full bg-teal-600 hover:bg-teal-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer shrink-0">
            <span class="text-base">👥</span> สรุปตามกลุ่มลูกค้า
        </button>

        <!-- 4. สรุปยอดขาย & ประวัติออร์เดอร์ -->
        <a href="SalesReport.html" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer no-underline block text-center shrink-0">
            <span class="text-base">📊</span> สรุปยอดขาย & ประวัติออร์เดอร์
        </a>

        <!-- 5. สต็อกสินค้าคงเหลือ -->
        <button type="button" onclick="goToPage('Inventory.html')" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer shrink-0">
            <span class="text-base">📦</span> สต็อกสินค้าคงเหลือ
        </button>

        <!-- 6. การจัดการสต็อกสินค้า (Edit Stock) -->
        <button type="button" onclick="goToPage('EditStock.html')" class="w-full bg-orange-600 hover:bg-orange-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer shrink-0">
            <span class="text-base">📦</span> การจัดการสต็อกสินค้า (Edit Stock)
        </button>

        <!-- 7. ผู้ดูแลระบบ -->
        <button type="button" onclick="goToPage('PageAdmin.html')" class="w-full bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2.5 text-sm cursor-pointer shrink-0">
            <span class="text-base">🔒</span> ผู้ดูแลระบบ
        </button>
    </div>
</div>

<script>
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    function goToPage(url) {
        window.location.href = url;
    }
</script>
</body>
</html>
